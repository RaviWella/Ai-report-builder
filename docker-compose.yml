version: '3.8'

services:
  # PostgreSQL — application DB (hrm_platform) + per-tenant warehouse DBs (hrm_wh_*)
  postgres:
    image: postgres:15-alpine
    container_name: hrm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      APP_DATABASE_NAME: hrm_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm-platform-backend
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/hrm_platform
      APP_DATABASE_NAME: hrm_platform
      APP_AUTO_PROVISION: "false"
      WAREHOUSE_AUTO_PROVISION: "true"
      RUN_MIGRATIONS_IN_ENTRYPOINT: "true"
      RUN_MIGRATIONS_ON_STARTUP: "false"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    volumes:
      - ./backend:/app
      # Preserve dbt_packages from the image (or entrypoint deps) — host bind mount is gitignored
      - backend_dbt_packages:/app/dbt_project/hr_mart/dbt_packages

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api/v1
        REACT_APP_API_KEY: ${REACT_APP_API_KEY}
    container_name: hrm-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_dbt_packages:
