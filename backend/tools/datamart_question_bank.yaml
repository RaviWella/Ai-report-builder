# Datamart question bank — demo_tenant (hr, hr_semantic, hr_snap).
# 60 advanced prompts in 10 parallel sets of 6 (retrieval / broker / catalog SQL eval).
#
# Fields:
#   question          — natural-language prompt (Datamart chat style)
#   expect_tables     — tables/views broker should ground (≥1 must appear unless require_all_tables)
#   require_all_tables — if true, every expect_tables entry must be grounded
#   template          — optional ReportSpec catalog template
#   eval_domain       — fixture domain for offline catalog CI (payroll, leave, …)
#
# Live eval (10 sets in parallel):
#   cd backend && PYTHONPATH=. python tools/run_question_bank_eval.py --all-sets --parallel
# Single set:
#   PYTHONPATH=. python tools/run_question_bank_eval.py --set 3

meta:
  tenant: demo_tenant
  question_count: 66
  set_count: 11
  set_size: 6
  level: advanced
  schemas: [hr_semantic, hr, hr_snap]
  notes: >
    Evaluates schema broker retrieval + catalog SQL (no LLM). Failures usually mean
    missing tables in grounded context — fix DataHub, semantic catalog, or broker ranking.

# ── Set 1: Advanced payroll & processed compensation ─────────────────
advanced_payroll:
  - question: >
      For the latest payroll period, rank payroll groups by total net salary and show
      payroll group name, currency code, employee count, sum of net salary, sum of gross
      salary, and average basic salary. Exclude groups with zero employees.
    expect_tables: [vw_payroll_summary, dim_payroll_group, mart_processed_payroll_summary]
    eval_domain: payroll
  - question: >
      List employees whose total deductions exceed 25% of gross salary in the latest pay
      run, including employee name, employee number, branch, payroll group name, gross,
      total deductions, and net salary. Order by deduction ratio descending.
    expect_tables: [vw_payroll_summary, dim_payroll_group]
    require_all_tables: false
    eval_domain: payroll
  - question: >
      Compare total EPF employee, ETF, and tax amounts by branch for the current calendar
      year using processed payroll and tax facts, with branch name from the employee mart.
    expect_tables: [fct_processed_tax, fct_compliance_payroll, mart_employee_current, vw_payroll_summary]
    eval_domain: payroll
  - question: >
      Show month-over-month change in total gross payroll by payroll group for the last
      six months using processed salary and payroll period dimensions.
    expect_tables: [fct_processed_salary, dim_payroll_period, dim_payroll_group]
    eval_domain: payroll
  - question: >
      Which branches have the highest average basic salary among active employees in the
      payroll summary view, with at least 5 employees per branch? Include branch, headcount,
      and average basic salary.
    expect_tables: [vw_payroll_summary, mart_employee_current]
    template: payroll.summary_detail
    eval_domain: payroll
  - question: >
      Prepare a payroll summary report by combining employee, payroll group, and employee
      snapshot details. Include employee name, employee ID, payroll group name, pay frequency,
      currency code, branch, and current basic salary for active employees only.
    expect_tables: [vw_payroll_summary, dim_payroll_group, mart_employee_current]
    template: payroll.summary_detail
    eval_domain: payroll

# ── Set 2: Advanced leave & absence overlap ──────────────────────────
advanced_leave:
  - question: >
      For each leave type, show total approved leave days, number of distinct employees,
      and average days per employee this year, using leave balance and current employee
      branch. Only approved leave.
    expect_tables: [fact_leave_balance, mart_employee_current, dim_leave_type]
    eval_domain: leave
  - question: >
      List employees who took more than 15 approved leave days in the current year and
      still have remaining balance below 5 days, with employee name, branch, leave type,
      days approved, and balance remaining.
    expect_tables: [fact_leave_balance, vw_leave_summary, mart_employee_current]
    eval_domain: leave
  - question: >
      Generate a report of employees and their leave details. Include employee name,
      employee ID, branch, leave type, leave start date, leave end date, total leave days,
      and leave status. Display only approved leave requests.
    expect_tables: [mart_employee_current, fact_leave_balance]
    template: leave.detail_list
    eval_domain: leave
  - question: >
      By department, compare total approved leave days versus active headcount and compute
      average leave days per employee for the current fiscal year.
    expect_tables: [fact_leave_balance, mart_employee_current, vw_leave_summary]
    eval_domain: leave
  - question: >
      Which branches have the highest share of employees with any approved leave in the
      last 90 days? Show branch, employees on leave, total active employees, and percentage.
    expect_tables: [vw_leave_summary, mart_employee_current, fact_leave_balance]
    eval_domain: leave
  - question: >
      Show employees with consecutive approved leave spans exceeding 10 working days in
      the current year, including employee name, branch, leave type, start date, end date,
      and total days.
    expect_tables: [fact_leave_balance, mart_employee_current]
    eval_domain: leave

# ── Set 3: Advanced attendance & overtime ────────────────────────────
advanced_attendance:
  - question: >
      For this month, rank departments by late arrival events and show present days,
      absent days, late events, and overtime hours per department from attendance summaries.
    expect_tables: [vw_attendance_summary, mart_attendance_monthly_summary, mart_employee_current]
    eval_domain: attendance
  - question: >
      List employees with absent days greater than present days in the current month,
      including employee name, branch, department, absent days, and present days.
    expect_tables: [vw_attendance_summary, fact_attendance, mart_employee_current]
    eval_domain: attendance
  - question: >
      Show attendance summary for this month with present days, absent days, and late
      events aggregated by branch.
    expect_tables: [vw_attendance_summary, mart_attendance_monthly_summary]
    template: attendance.monthly_summary
    eval_domain: attendance
  - question: >
      Compare total overtime hours versus total present days by branch for the last three
      months using overtime facts and attendance monthly summary.
    expect_tables: [fct_overtime, mart_attendance_monthly_summary, mart_employee_current]
    eval_domain: attendance
  - question: >
      Which employees have more than 20 late events year-to-date but fewer than 3 absent
      days in the same period? Include name, branch, late count, and absent days.
    expect_tables: [fact_attendance, vw_attendance_summary, mart_employee_current]
    eval_domain: attendance
  - question: >
      Show weekly trend of absent days and late events for the company for the last eight
      weeks from attendance summary views.
    expect_tables: [vw_attendance_summary, mart_attendance_monthly_summary]
    eval_domain: attendance

# ── Set 4: Advanced workforce & organization ─────────────────────────
advanced_workforce:
  - question: >
      Generate a workforce report by combining employee and organization data. Include
      employee name, employee ID, company, branch, department, organization unit,
      designation, and reporting manager name for active employees.
    expect_tables: [mart_employee_current, dim_employee, dim_org_unit]
    template: workforce.roster
    eval_domain: workforce
  - question: >
      For each reporting manager, show manager name, branch, count of direct reports,
      and count of indirect reports (two levels) using current employee mart hierarchy fields.
    expect_tables: [mart_employee_current, dim_employee]
    eval_domain: workforce
  - question: >
      List organization units with more than 50 active employees, showing org unit name,
      parent unit, branch, employee count, and most common designation.
    expect_tables: [mart_employee_current, dim_org_unit, dim_designation]
    require_all_tables: false
    eval_domain: workforce
  - question: >
      Show employees on probation ending in the next 60 days with employee name, branch,
      department, probation end date, and supervisor name.
    expect_tables: [mart_employee_current, dim_employee]
    eval_domain: workforce
  - question: >
      Break down active headcount by employment type, employee category, and legal entity,
      with subtotals per branch.
    expect_tables: [mart_employee_current, dim_employee]
    eval_domain: workforce
  - question: >
      Find employees without a populated reporting manager but with a non-null department,
      listing name, employee number, branch, and department.
    expect_tables: [mart_employee_current]
    eval_domain: workforce

# ── Set 5: Advanced attrition & lifecycle ────────────────────────────
advanced_attrition:
  - question: >
      Which departments have the highest attrition rate over the last twelve months?
      Rank departments by computed attrition rate using turnover and headcount views,
      and show separations, average headcount, and rate percentage.
    expect_tables: [vw_turnover, vw_headcount, mart_employee_current]
    template: attrition.rate_by_department
    eval_domain: attrition
  - question: >
      Compare monthly separations versus hires for the last twelve months using lifecycle
      summary and employment monthly views.
    expect_tables: [vw_lifecycle_summary, vw_employment_monthly, fct_lifecycle_event]
    eval_domain: attrition
  - question: >
      List branches where attrition rate exceeds company average by more than 5 percentage
      points, using turnover and headcount by branch.
    expect_tables: [vw_turnover, vw_headcount, mart_employee_current]
    eval_domain: attrition
  - question: >
      Show separation events by event type and reason for the current year with counts
      and percentage of total separations.
    expect_tables: [fct_lifecycle_event, vw_lifecycle_summary]
    eval_domain: attrition
  - question: >
      For departments with at least 20 employees, rank by attrition rate and include
      department name, starting headcount, separations, and attrition rate percent.
    expect_tables: [vw_turnover, vw_headcount]
    template: attrition.rate_by_department
    eval_domain: attrition
  - question: >
      Identify employees who separated in the last quarter and had tenure under 12 months,
      with name, branch, hire date, separation date, and event type.
    expect_tables: [fct_lifecycle_event, mart_employee_current, vw_lifecycle_summary]
    eval_domain: attrition

# ── Set 6: Advanced headcount & snapshots ────────────────────────────
advanced_headcount:
  - question: >
      Show headcount trend by month for the last twelve months with total active employees,
      new hires, and separations per month from headcount monthly mart and lifecycle views.
    expect_tables: [mart_headcount_monthly, vw_headcount, vw_lifecycle_summary]
    eval_domain: headcount
  - question: >
      Compare current headcount by branch versus headcount six months ago using monthly
      headcount mart and highlight branches with growth above 10%.
    expect_tables: [mart_headcount_monthly, vw_headcount, mart_employee_current]
    eval_domain: headcount
  - question: >
      What is the employee count by department and designation for active employees today,
      sorted by count descending?
    expect_tables: [vw_headcount, mart_employee_current, dim_designation]
    eval_domain: headcount
  - question: >
      List legal entities with fewer than 10 active employees but more than 3 separations
      in the last year, using headcount and lifecycle data.
    expect_tables: [vw_headcount, fct_lifecycle_event, mart_employee_current]
    eval_domain: headcount
  - question: >
      Show point-in-time headcount from snap tables for the same calendar day last year
      versus today by branch if snap headcount is available.
    expect_tables: [hr_snap, mart_headcount_monthly, vw_headcount]
    require_all_tables: false
    eval_domain: headcount
  - question: >
      For each branch, show current active headcount, count on probation, and count with
      no assigned pay group from employee mart and headcount view.
    expect_tables: [mart_employee_current, vw_headcount]
    eval_domain: headcount

# ── Set 7: Mixed payroll + leave ─────────────────────────────────────
advanced_mixed_payroll_leave:
  - question: >
      For employees in the top quartile of basic salary by branch, what is their average
      approved leave days this year compared to all other employees in the same branch?
    expect_tables: [vw_payroll_summary, fact_leave_balance, mart_employee_current]
    eval_domain: payroll
  - question: >
      List employees with net salary above branch median who also exceeded 20 approved leave
      days this year, showing name, branch, net salary, and leave days.
    expect_tables: [vw_payroll_summary, fact_leave_balance, mart_employee_current]
    eval_domain: payroll
  - question: >
      By payroll group, show average basic salary, average approved leave days per employee,
      and employee count for active staff.
    expect_tables: [vw_payroll_summary, dim_payroll_group, fact_leave_balance]
    eval_domain: payroll
  - question: >
      Which departments have high payroll cost (sum of basic salary) and high leave utilization
      (sum of approved leave days) in the same period? Rank departments by both metrics.
    expect_tables: [vw_payroll_summary, fact_leave_balance, mart_employee_current]
    eval_domain: payroll
  - question: >
      Show employees with zero approved leave days this year but salary in the top 10% of
      their department, including name, department, branch, and basic salary.
    expect_tables: [vw_payroll_summary, fact_leave_balance, mart_employee_current]
    eval_domain: payroll
  - question: >
      Compare average net salary between employees who took any sick leave versus none
      this year, broken down by branch.
    expect_tables: [vw_payroll_summary, vw_leave_summary, fact_leave_balance]
    eval_domain: payroll

# ── Set 8: Mixed attendance + workforce ──────────────────────────────
advanced_mixed_att_workforce:
  - question: >
      For each department, correlate average overtime hours with absent days this month
      and list department, headcount, avg overtime, and avg absent days.
    expect_tables: [fct_overtime, vw_attendance_summary, mart_employee_current]
    eval_domain: attendance
  - question: >
      List managers with more than 8 direct reports who also have above-average late events
      in their team this month (using employee mart and attendance summary).
    expect_tables: [mart_employee_current, vw_attendance_summary]
    eval_domain: workforce
  - question: >
      Show branches where absenteeism rate (absent days / working days) exceeds 5% while
      headcount grew month-over-month.
    expect_tables: [vw_attendance_summary, mart_headcount_monthly, mart_employee_current]
    eval_domain: attendance
  - question: >
      Employees on probation with more than 5 absent days this quarter: name, branch,
      supervisor, probation end date, absent days.
    expect_tables: [mart_employee_current, vw_attendance_summary, fact_attendance]
    eval_domain: workforce
  - question: >
      Rank designations by average late events per employee and show designation name,
      department, employee count, and average lates.
    expect_tables: [dim_designation, vw_attendance_summary, mart_employee_current]
    eval_domain: attendance
  - question: >
      For remote versus on-site employment types (if available), compare present days,
      absent days, and overtime hours for the current month.
    expect_tables: [mart_employee_current, vw_attendance_summary, fct_overtime]
    require_all_tables: false
    eval_domain: workforce

# ── Set 9: Benefits, loans, performance ──────────────────────────────
advanced_benefits_performance:
  - question: >
      Summarize processed payroll additions and deductions by canonical pay item for the
      latest run, with pay item name, type, total amount, and employee count affected.
    expect_tables: [fct_processed_add_ded, dim_canonical_pay_item, mart_processed_payroll_summary]
    eval_domain: payroll
  - question: >
      List employees with active loan deductions in the latest payroll exceeding 10% of net
      salary, showing employee name, branch, loan deduction amount, and net salary.
    expect_tables: [fct_processed_loan_deduction, vw_payroll_summary, mart_employee_current]
    eval_domain: payroll
  - question: >
      Show salary band distribution: count of employees per band with band min, max, and
      average basic salary from salary bands view.
    expect_tables: [vw_salary_bands, mart_salary_band_summary, mart_employee_current]
    eval_domain: compensation
  - question: >
      List salary change events in the last six months where increase exceeded 20%, with
      employee name, old basic salary, new basic salary, change date, and branch.
    expect_tables: [fct_salary_change, mart_employee_current]
    eval_domain: compensation
  - question: >
      Show performance review ratings distribution by department for the latest review cycle,
      including department, rating bucket, and employee count.
    expect_tables: [vw_performance_summary, mart_employee_current]
    eval_domain: performance
  - question: >
      Which departments have the highest share of employees rated below expectations in the
      latest performance cycle, with department name, count below threshold, and total reviewed?
    expect_tables: [vw_performance_summary, mart_employee_current]
    eval_domain: performance

# ── Set 10: Advanced recruitment ─────────────────────────────────────
advanced_recruitment:
  - question: >
      Prepare a recruitment pipeline report showing candidates sourced through LinkedIn
      and employee referrals, including candidate name, contact email, recruitment source,
      appointment date, expected joining date, and assigned branch. Include only candidates
      who are expected to join within the next 60 days.
    expect_tables: [fct_lifecycle_event, mart_employee_current, dim_employee, dim_org_unit]
    eval_domain: recruitment
  - question: >
      List all candidates in the hiring pipeline with recruitment source, current stage,
      and expected joining date for the next 90 days, grouped by branch.
    expect_tables: [fct_lifecycle_event, mart_employee_current, dim_employee, dim_org_unit]
    eval_domain: recruitment
  - question: >
      Which recruitment sources (LinkedIn vs referrals vs other) produced the most
      candidates appointed in the last quarter?
    expect_tables: [fct_lifecycle_event, mart_employee_current, dim_employee]
    eval_domain: recruitment
  - question: >
      Show average time-to-hire in days by recruitment source for candidates who joined
      in the last six months, using appointment date and joining date from the pipeline fact.
    expect_tables: [fct_lifecycle_event, mart_employee_current, dim_employee]
    eval_domain: recruitment
  - question: >
      List open requisitions with count of active candidates in the pipeline, recruitment
      source mix, and assigned branch from recruitment pipeline and job dimensions.
    expect_tables: [fct_lifecycle_event, mart_employee_current, dim_org_unit]
    eval_domain: recruitment
  - question: >
      For candidates with expected joining date in the next 30 days, show candidate name,
      recruitment source, appointment date, and branch sorted by joining date.
    expect_tables: [fct_lifecycle_event, mart_employee_current, dim_employee, dim_org_unit]
    eval_domain: recruitment

# ── Set 11: Executive cross-domain analytics ───────────────────────────
advanced_executive:
  - question: >
      Executive dashboard by branch: active headcount, total gross payroll for latest period,
      average basic salary, total approved leave days YTD, and attrition rate last 12 months.
    expect_tables: [vw_headcount, vw_payroll_summary, fact_leave_balance, vw_turnover, mart_employee_current]
    require_all_tables: false
    eval_domain: headcount
  - question: >
      For each branch, compute revenue proxy metrics: headcount, payroll cost (sum basic),
      overtime cost proxy, and leave days per employee — rank branches by payroll per head.
    expect_tables: [mart_employee_current, vw_payroll_summary, fct_overtime, fact_leave_balance]
    require_all_tables: false
    eval_domain: payroll
  - question: >
      Identify departments with rising attrition (last 6 months vs prior 6 months), increasing
      absent days, and flat headcount using turnover, attendance, and headcount monthly data.
    expect_tables: [vw_turnover, vw_attendance_summary, mart_headcount_monthly]
    eval_domain: attrition
  - question: >
      Top 10 cost drivers: employees with highest combined basic salary, overtime hours, and
      approved leave days in the current year, with name, branch, and department.
    expect_tables: [mart_employee_current, vw_payroll_summary, fct_overtime, fact_leave_balance]
    eval_domain: compensation
  - question: >
      Show the top 5 employees by basic salary with name, branch, department, pay group,
      and designation — exclude rows with null salary.
    expect_tables: [mart_employee_current, vw_payroll_summary]
    eval_domain: compensation
  - question: >
      Company-wide KPI table: total active employees, total net payroll latest period, average
      attrition rate by department (top 5 departments by rate), and total absent days this month.
    expect_tables: [vw_headcount, vw_payroll_summary, vw_turnover, vw_attendance_summary]
    require_all_tables: false
    eval_domain: headcount
