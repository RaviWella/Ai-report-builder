# Legacy upgrade path (shared DB with tenant_id → schema-per-tenant).
# Use only when upgrading an existing deployment — NOT for new empty databases.
#
#   alembic -c alembic_legacy.ini upgrade head

[alembic]
script_location = migrations
version_locations = migrations/versions_legacy
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
