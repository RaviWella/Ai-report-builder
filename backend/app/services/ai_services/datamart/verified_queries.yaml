# Curated verified question → SQL (Tier B). Placeholders: {schema}, {limit}
# Seed from datamart_question_bank.yaml — expand as eval passes.

queries:
- id: workforce_roster
  domain: workforce
  question: 'Generate a workforce report combining employee and organization data with employee name,
    employee ID, company, branch, department, organization unit, designation, and reporting manager for
    active employees.

    '
  tables:
  - mart_employee_current
  - dim_org_unit
  narrative: Active workforce roster from the current employee mart.
  sql: "SELECT\n  e.emp_no AS employee_id,\n  e.emp_fullname AS employee_name,\n  e.legal_entity AS company,\n  e.location_name AS branch,\n  e.designation_department AS department,\n  e.emp_position AS organization_unit,\n  e.designation AS designation,\n  e.superior_fullname AS reporting_manager\nFROM hr.mart_employee_current e\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\nORDER BY e.emp_fullname\nLIMIT {limit};\n"
- id: leave_detail_approved
  domain: leave
  question: 'Generate a report of employees and leave details including employee name, employee ID, branch,
    leave type, leave start date, leave end date, total leave days, and leave status for approved leave
    only.

    '
  tables:
  - mart_employee_current
  - fact_leave_balance
  narrative: Approved leave detail from the leave balance fact joined to employees.
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.emp_no AS employee_id,\n  e.location_name AS branch,\n\
    \  lb.leave_type_name AS leave_type,\n  lb.period_label AS leave_period,\n  lb.days_approved AS total_leave_days,\n\
    \  lb.balance_days AS balance_remaining\nFROM hr.fact_leave_balance lb\nJOIN hr.mart_employee_current\
    \ e ON e.employee_sk = lb.employee_sk\nWHERE COALESCE(lb.days_approved, 0) > 0\nORDER BY lb.days_approved\
    \ DESC\nLIMIT {limit};\n"
- id: payroll_summary_active
  domain: payroll
  question: 'Prepare a payroll summary report with employee name, employee ID, payroll group name, pay
    frequency, currency code, branch, and current basic salary for active employees only.

    '
  tables:
  - vw_payroll_summary
  - dim_payroll_group
  - mart_employee_current
  narrative: Active employee payroll summary from vw_payroll_summary.
  sql: "SELECT\n  p.emp_fullname AS employee_name,\n  p.emp_no AS employee_id,\n  p.payroll_group_name,\n  pg.payroll_frequency AS pay_frequency,\n\
    \  pg.currency_code,\n  p.branch AS branch,\n  p.basic_salary\nFROM hr_semantic.vw_payroll_summary\
    \ p\nLEFT JOIN hr.dim_payroll_group pg\n  ON pg.payroll_group_name::text = p.payroll_group_name::text\n\
    WHERE COALESCE(p.run_status, '') NOT IN ('cancelled', 'void')\nORDER BY p.emp_fullname\nLIMIT {limit};\n"
- id: bank_advanced_payroll_rank_groups
  domain: payroll
  question: >
    For the latest payroll period, rank payroll groups by total net salary and show
    payroll group name, currency code, employee count, sum of net salary, sum of gross
    salary, and average basic salary. Exclude groups with zero employees.
  tables:
  - vw_payroll_summary
  - dim_payroll_group
  narrative: Payroll group ranking by net salary (latest period).
  sql: "SELECT\n  p.payroll_group_name,\n  pg.currency_code,\n  COUNT(DISTINCT p.employee_sk) AS employee_count,\n\
    \  SUM(COALESCE(p.net_salary, 0)) AS total_net_salary,\n  SUM(COALESCE(p.gross_salary, 0)) AS total_gross_salary,\n\
    \  AVG(COALESCE(p.basic_salary, 0)) AS avg_basic_salary\nFROM hr_semantic.vw_payroll_summary p\nLEFT JOIN hr.dim_payroll_group\
    \ pg ON pg.payroll_group_name::text = p.payroll_group_name::text\nWHERE p.payroll_group_name IS NOT NULL\n\
    GROUP BY p.payroll_group_name, pg.currency_code\nHAVING COUNT(DISTINCT p.employee_sk) > 0\nORDER BY total_net_salary\
    \ DESC NULLS LAST\nLIMIT {limit};\n"
- id: bank_advanced_payroll_deduction_ratio
  domain: payroll
  question: >
    List employees whose total deductions exceed 25% of gross salary in the latest pay
    run, including employee name, employee number, branch, payroll group name, gross,
    total deductions, and net salary. Order by deduction ratio descending.
  tables:
  - vw_payroll_summary
  - dim_payroll_group
  narrative: High deduction ratio employees from payroll summary view.
  sql: "SELECT\n  p.emp_fullname AS employee_name,\n  p.emp_no AS employee_number,\n  p.branch AS branch,\n\
    \  p.payroll_group_name,\n  p.gross_salary,\n  p.total_deductions,\n  p.net_salary,\n  CASE WHEN COALESCE(p.gross_salary,\
    \ 0) > 0 THEN p.total_deductions / p.gross_salary ELSE NULL END AS deduction_ratio\nFROM hr_semantic.vw_payroll_summary\
    \ p\nWHERE COALESCE(p.gross_salary, 0) > 0\n  AND p.total_deductions > 0.25 * p.gross_salary\nORDER BY deduction_ratio\
    \ DESC NULLS LAST\nLIMIT {limit};\n"
- id: bank_advanced_payroll_epf_by_branch
  domain: payroll
  question: >
    Compare total EPF employee, ETF, and tax amounts by branch for the current calendar
    year using processed payroll and tax facts, with branch name from the employee mart.
  tables:
  - vw_payroll_summary
  - mart_employee_current
  narrative: EPF, ETF, and tax totals by branch for current year.
  sql: "SELECT\n  p.branch AS branch_name,\n  SUM(COALESCE(p.epf_employee_amount, 0)) AS total_epf_employee,\n\
    \  SUM(COALESCE(p.etf_amount, 0)) AS total_etf,\n  SUM(COALESCE(p.tax_amount, 0)) AS total_tax\nFROM hr_semantic.vw_payroll_summary\
    \ p\nWHERE COALESCE(p.payroll_year, EXTRACT(YEAR FROM CURRENT_DATE)::int) = EXTRACT(YEAR FROM CURRENT_DATE)::int\n\
    GROUP BY p.branch\nORDER BY total_epf_employee DESC NULLS LAST\nLIMIT {limit};\n"
- id: attendance_monthly_branch
  domain: attendance
  question: 'Show attendance summary for this month with present days, absent days, and late events aggregated
    by branch.

    '
  tables:
  - vw_attendance_summary
  - mart_attendance_monthly_summary
  narrative: Monthly attendance totals by branch.
  sql: "SELECT\n  e.location_name AS branch,\n  SUM(COALESCE(ams.days_present, 0)) AS present_days,\n  SUM(COALESCE(ams.days_absent, 0)) AS absent_days,\n  SUM(COALESCE(ams.days_late, 0)) AS late_events\nFROM hr.mart_attendance_monthly_summary ams\nJOIN hr.mart_employee_current e ON e.employee_sk = ams.employee_sk\nWHERE ams.year_month = TO_CHAR(CURRENT_DATE, 'YYYY-MM')\nGROUP BY e.location_name\nORDER BY e.location_name\nLIMIT {limit};\n"
- id: bank_advanced_attendance_dept_late
  domain: attendance
  question: >
    For this month, rank departments by late arrival events and show present days,
    absent days, late events, and overtime hours per department from attendance summaries.
  tables:
  - mart_attendance_monthly_summary
  - mart_employee_current
  - vw_attendance_summary
  narrative: Department attendance KPIs for current month.
  sql: "SELECT\n  e.designation_department AS department,\n  SUM(COALESCE(ams.days_present, 0)) AS present_days,\n  SUM(COALESCE(ams.days_absent, 0)) AS absent_days,\n  SUM(COALESCE(ams.days_late, 0)) AS late_events,\n  SUM(COALESCE(ams.total_overtime_hours, 0)) AS overtime_hours\nFROM hr.mart_attendance_monthly_summary ams\nJOIN hr.mart_employee_current e ON e.employee_sk = ams.employee_sk\nWHERE ams.year_month = TO_CHAR(CURRENT_DATE, 'YYYY-MM')\nGROUP BY e.designation_department\nORDER BY late_events DESC\nLIMIT {limit};\n"
- id: recruitment_pipeline_linkedin_referral
  domain: recruitment
  question: 'Prepare a recruitment pipeline report showing candidates sourced through LinkedIn and employee
    referrals, including candidate name, contact email, recruitment source, appointment date, expected
    joining date, and assigned branch. Include only candidates who are expected to join within the next
    60 days.

    '
  tables:
  - fct_lifecycle_event
  - mart_employee_current
  - dim_employee
  - dim_org_unit
  narrative: Hire lifecycle proxy for recruitment pipeline (demo warehouse).
  sql: "WITH hire_pipeline AS (\n  SELECT\n    e.emp_fullname AS candidate_name,\n    d.email AS contact_email,\n    CASE\n      WHEN COALESCE(e.employee_category, '') ILIKE '%referral%' THEN 'Employee Referral'\n      WHEN COALESCE(e.employee_category, '') ILIKE '%linkedin%' THEN 'LinkedIn'\n      ELSE COALESCE(NULLIF(TRIM(e.employee_category), ''), NULLIF(TRIM(e.employment_type), ''), 'Other')\n    END AS recruitment_source,\n    le.approved_date AS appointment_date,\n    COALESCE(e.join_date, le.effective_date) AS expected_joining_date,\n    e.location_name AS assigned_branch\n  FROM hr.fct_lifecycle_event le\n  JOIN hr.mart_employee_current e ON e.employee_sk = le.employee_sk\n  LEFT JOIN hr.dim_employee d ON d.employee_sk = e.employee_sk AND d.is_current IS TRUE\n  WHERE le.event_name ILIKE '%join%' OR le.event_category ILIKE '%hire%'\n)\nSELECT\n  hp.candidate_name,\n  hp.contact_email,\n  hp.recruitment_source,\n  hp.appointment_date,\n  hp.expected_joining_date,\n  hp.assigned_branch\nFROM hire_pipeline hp\nWHERE (hp.recruitment_source ILIKE '%linkedin%' OR hp.recruitment_source ILIKE '%referral%')\n  AND hp.expected_joining_date >= CURRENT_DATE - INTERVAL '60 days'\n  AND hp.expected_joining_date < CURRENT_DATE + INTERVAL '60 days'\nORDER BY hp.expected_joining_date\nLIMIT {limit};\n"
- id: bank_advanced_recruitment_pipeline_90d
  domain: recruitment
  question: 'List all candidates in the hiring pipeline with recruitment source, current stage, and
    expected joining date for the next 90 days, grouped by branch.

    '
  tables:
  - fct_lifecycle_event
  - mart_employee_current
  - dim_employee
  narrative: Hire lifecycle proxy — pipeline grouped by branch (90-day window).
  sql: "WITH hire_pipeline AS (\n  SELECT\n    e.emp_fullname AS candidate_name,\n    CASE\n      WHEN COALESCE(e.employee_category, '') ILIKE '%referral%' THEN 'Employee Referral'\n      WHEN COALESCE(e.employee_category, '') ILIKE '%linkedin%' THEN 'LinkedIn'\n      ELSE COALESCE(NULLIF(TRIM(e.employee_category), ''), 'Other')\n    END AS recruitment_source,\n    le.event_name AS current_stage,\n    COALESCE(e.join_date, le.effective_date) AS expected_joining_date,\n    e.location_name AS assigned_branch\n  FROM hr.fct_lifecycle_event le\n  JOIN hr.mart_employee_current e ON e.employee_sk = le.employee_sk\n  WHERE le.event_name ILIKE '%join%' OR le.event_category ILIKE '%hire%'\n)\nSELECT\n  hp.assigned_branch AS branch,\n  hp.recruitment_source,\n  hp.current_stage,\n  hp.expected_joining_date,\n  COUNT(*) AS candidate_count\nFROM hire_pipeline hp\nWHERE hp.expected_joining_date >= CURRENT_DATE - INTERVAL '90 days'\n  AND hp.expected_joining_date < CURRENT_DATE + INTERVAL '90 days'\nGROUP BY hp.assigned_branch, hp.recruitment_source, hp.current_stage, hp.expected_joining_date\nORDER BY 1, 4\nLIMIT {limit};\n"
- id: employee_bank_details
  domain: workforce
  question: |
    List employee number, employee full name, employment category and bank details of the employees
  tables:
  - mart_employee_current
  - fct_salary_bank_instruction
  - dim_bank
  narrative: Employee salary bank instructions joined to bank dimension.
  sql: "SELECT\n  m.emp_no AS employee_number,\n  m.emp_fullname AS employee_name,\n  dbk.bank_code,\n\
    \  dbk.bank_name,\n  bi.account_number\nFROM hr.mart_employee_current m\nJOIN hr.fct_salary_bank_instruction\
    \ bi ON bi.employee_sk = m.employee_sk\nLEFT JOIN hr.dim_bank dbk\n  ON dbk.source_bank_id::text\
    \ = bi.source_bank_id::text\nWHERE COALESCE(m.emp_status, '') ILIKE '%active%'\nORDER BY m.emp_fullname\n\
    LIMIT {limit};\n"
- id: employee_shift_assignment
  domain: workforce
  question: 'Show employee shift assignments with employee number, employee name, and shift name.

    '
  tables:
  - mart_employee_current
  - dim_shift
  narrative: Current employees with shift names from the shift dimension.
  sql: "SELECT\n  m.emp_no AS employee_number,\n  m.emp_fullname AS employee_name,\n  s.shift_name\nFROM\
    \ hr.mart_employee_current m\nLEFT JOIN hr.dim_shift s ON s.source_shift_id::text = m.source_shift_id::text\n\
    WHERE COALESCE(m.emp_status, '') ILIKE '%active%'\nORDER BY m.emp_fullname\nLIMIT {limit};\n"
- id: leave_balance_summary
  domain: leave
  question: 'Show leave balance summary by employee with leave type and remaining leave days.

    '
  tables:
  - fact_leave_balance
  - mart_employee_current
  narrative: Leave balances by employee and leave type.
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.emp_no AS employee_id,\n  lb.leave_type_name,\n  lb.days_approved AS remaining_days\nFROM hr.fact_leave_balance lb\nJOIN hr.mart_employee_current e ON e.employee_sk = lb.employee_sk\nORDER BY e.emp_fullname, lb.leave_type_name\nLIMIT {limit};\n"
- id: headcount_scalar
  domain: workforce
  question: What is the current headcount of active employees?
  tables:
  - mart_employee_current
  narrative: Count of distinct active employees in the workforce mart.
  sql: "SELECT COUNT(DISTINCT e.employee_sk) AS headcount\nFROM hr.mart_employee_current e\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\nLIMIT {limit};\n"
- id: headcount_by_department
  domain: headcount
  question: What is our current headcount by department?
  tables:
  - mart_employee_current
  narrative: Active employee headcount grouped by department.
  sql: "SELECT\n  e.designation_department AS department,\n  COUNT(DISTINCT e.employee_sk) AS headcount\nFROM hr.mart_employee_current e\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\n  AND e.designation_department IS NOT NULL\n  AND TRIM(e.designation_department) <> ''\nGROUP BY e.designation_department\nORDER BY headcount DESC, department\nLIMIT {limit};\n"
- id: headcount_by_branch
  domain: headcount
  question: What is the current headcount by branch?
  tables:
  - mart_employee_current
  narrative: Active employee headcount grouped by branch.
  sql: "SELECT\n  e.location_name AS branch,\n  COUNT(DISTINCT e.employee_sk) AS headcount\nFROM hr.mart_employee_current e\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\n  AND e.location_name IS NOT NULL\n  AND TRIM(e.location_name) <> ''\nGROUP BY e.location_name\nORDER BY headcount DESC, branch\nLIMIT {limit};\n"
- id: attrition_rate_by_department
  domain: attrition
  question: 'Which departments have the highest attrition rate or employee turnover?

    '
  tables:
  - vw_turnover
  - vw_headcount
  - mart_employee_current
  narrative: Attrition rate by department from turnover and headcount views.
  sql: "WITH sep_by_dim AS (\n  SELECT t.department_id, COUNT(DISTINCT t.employee_id) AS separation_count\n  FROM hr_semantic.vw_turnover t\n  WHERE t.employee_id IS NOT NULL AND t.department_id IS NOT NULL\n  GROUP BY t.department_id\n),\nhc_by_dim AS (\n  SELECT h.department_id, COUNT(DISTINCT h.employee_id) AS active_headcount\n  FROM hr_semantic.vw_headcount h\n  WHERE h.is_active IS TRUE AND h.employee_id IS NOT NULL AND h.department_id IS NOT NULL\n  GROUP BY h.department_id\n),\ndept_label AS (\n  SELECT DISTINCT m.emp_section_id AS department_id, m.designation_department AS department\n  FROM hr.mart_employee_current m\n  WHERE m.emp_section_id IS NOT NULL AND m.designation_department IS NOT NULL\n)\nSELECT\n  COALESCE(d.department, 'Dept ' || s.department_id::text) AS department,\n  s.separation_count AS separations,\n  hc.active_headcount,\n  ROUND(100.0 * s.separation_count / NULLIF(hc.active_headcount, 0), 2) AS attrition_rate_pct\nFROM sep_by_dim s\nINNER JOIN hc_by_dim hc ON hc.department_id = s.department_id\nLEFT JOIN dept_label d ON d.department_id = s.department_id\nORDER BY attrition_rate_pct DESC NULLS LAST\nLIMIT {limit};\n"
- id: bank_advanced_payroll_0
  domain: payroll
  question: 'Show month-over-month change in total gross payroll by payroll group for the last six months
    using processed salary and payroll period dimensions.

    '
  tables:
  - fct_processed_salary
  - dim_payroll_period
  - dim_payroll_group
  narrative: Verified bank query (advanced_payroll).
  sql: "SELECT\n  pg.payroll_group_name,\n  date_trunc('month', pp.period_end_date::date) AS pay_month,\n  SUM(COALESCE(ps.gross_salary,\
    \ 0)) AS total_gross\nFROM hr.fct_processed_salary ps\nJOIN hr.dim_payroll_period pp ON\
    \ pp.payroll_period_sk = ps.payroll_period_sk\nLEFT JOIN hr.dim_payroll_group pg ON pg.payroll_group_sk\
    \ = ps.payroll_group_sk\nWHERE pp.period_end_date >= CURRENT_DATE - INTERVAL '6 months'\nGROUP BY 1,\
    \ 2\nORDER BY pay_month, pg.payroll_group_name\nLIMIT {limit};\n"
- id: bank_advanced_attendance_1
  domain: attendance
  question: 'List employees with absent days greater than present days in the current month, including
    employee name, branch, department, absent days, and present days.

    '
  tables:
  - vw_attendance_summary
  - fact_attendance
  - mart_employee_current
  narrative: Verified bank query (advanced_attendance).
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.location_name AS branch,\n  e.designation_department AS department,\n  ams.days_absent AS absent_days,\n  ams.days_present AS present_days\nFROM hr.mart_attendance_monthly_summary ams\nJOIN hr.mart_employee_current e ON e.employee_sk = ams.employee_sk\nWHERE ams.year_month = TO_CHAR(CURRENT_DATE, 'YYYY-MM')\n  AND COALESCE(ams.days_absent, 0) > COALESCE(ams.days_present, 0)\nORDER BY ams.days_absent DESC\nLIMIT {limit};\n"
- id: bank_advanced_attendance_2
  domain: attendance
  question: 'Which employees have more than 20 late events year-to-date but fewer than 3 absent days in
    the same period? Include name, branch, late count, and absent days.

    '
  tables:
  - fact_attendance
  - vw_attendance_summary
  - mart_employee_current
  narrative: Verified bank query (advanced_attendance).
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.location_name AS branch,\n  SUM(COALESCE(a.late_count, 0)) AS late_count,\n  SUM(GREATEST(COALESCE(a.scheduled_days, 0) - COALESCE(a.present_days, 0), 0)) AS absent_days\nFROM hr_semantic.vw_attendance_summary a\nJOIN hr.mart_employee_current e ON e.employee_sk = a.employee_sk\nWHERE a.year = EXTRACT(YEAR FROM CURRENT_DATE)::int\nGROUP BY e.emp_fullname, e.location_name\nHAVING SUM(COALESCE(a.late_count, 0)) > 20\n   AND SUM(GREATEST(COALESCE(a.scheduled_days, 0) - COALESCE(a.present_days, 0), 0)) < 3\nORDER BY late_count DESC\nLIMIT {limit};\n"
- id: bank_advanced_workforce_3
  domain: workforce
  question: 'For each reporting manager, show manager name, branch, count of direct reports, and count
    of indirect reports (two levels) using current employee mart hierarchy fields.

    '
  tables:
  - mart_employee_current
  - dim_employee
  narrative: Verified bank query (advanced_workforce).
  sql: "SELECT\n  m.superior_fullname AS manager_name,\n  m.location_name AS branch,\n  COUNT(*) AS direct_reports,\n  COUNT(DISTINCT r2.emp_no) AS indirect_reports\nFROM hr.mart_employee_current m\nLEFT JOIN hr.mart_employee_current r1 ON r1.superior_emp_no = m.emp_no AND COALESCE(r1.emp_status, '') ILIKE '%active%'\nLEFT JOIN hr.mart_employee_current r2 ON r2.superior_emp_no = r1.emp_no AND COALESCE(r2.emp_status, '') ILIKE '%active%'\nWHERE COALESCE(m.emp_status, '') ILIKE '%active%'\n  AND m.superior_emp_no IS NOT NULL\nGROUP BY m.superior_fullname, m.location_name\nORDER BY direct_reports DESC\nLIMIT {limit};\n"
- id: bank_advanced_workforce_4
  domain: workforce
  question: 'Show employees on probation ending in the next 60 days with employee name, branch, department,
    probation end date, and supervisor name.

    '
  tables:
  - mart_employee_current
  - dim_employee
  narrative: Verified bank query (advanced_workforce).
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.location_name AS branch,\n  e.designation_department AS department,\n  e.probation_due_date AS probation_end_date,\n  e.superior_fullname AS supervisor_name\nFROM hr.mart_employee_current e\nWHERE e.probation_due_date >= CURRENT_DATE\n  AND e.probation_due_date < CURRENT_DATE + INTERVAL '60 days'\nORDER BY e.probation_due_date\nLIMIT {limit};\n"
- id: bank_advanced_workforce_5
  domain: workforce
  question: 'Break down active headcount by employment type, employee category, and legal entity, with
    subtotals per branch.

    '
  tables:
  - mart_employee_current
  - dim_employee
  narrative: Verified bank query (advanced_workforce).
  sql: "SELECT\n  e.location_name AS branch,\n  e.employee_category,\n  e.employment_type,\n  e.legal_entity,\n  COUNT(*) AS headcount\nFROM hr.mart_employee_current e\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\nGROUP BY e.location_name, e.employee_category, e.employment_type, e.legal_entity\nORDER BY branch, headcount DESC\nLIMIT {limit};\n"
- id: bank_advanced_workforce_org_units
  domain: workforce
  question: 'List organization units with more than 50 active employees, showing org unit name, parent
    unit, branch, employee count, and most common designation.

    '
  tables:
  - mart_employee_current
  - dim_org_unit
  - dim_designation
  narrative: Verified bank query (org units by section).
  sql: "SELECT\n  e.emp_section_id AS org_unit_name,\n  NULL::text AS parent_unit,\n  e.location_name AS branch,\n  COUNT(*) AS employee_count,\n  MODE() WITHIN GROUP (ORDER BY e.designation) AS most_common_designation\nFROM hr.mart_employee_current e\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\n  AND e.emp_section_id IS NOT NULL\nGROUP BY e.emp_section_id, e.location_name\nHAVING COUNT(*) > 50\nORDER BY employee_count DESC\nLIMIT {limit};\n"
- id: bank_advanced_workforce_no_manager
  domain: workforce
  question: 'Find employees without a populated reporting manager but with a non-null department, listing
    name, employee number, branch, and department.

    '
  tables:
  - mart_employee_current
  narrative: Verified bank query (employees missing manager).
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.emp_no AS employee_number,\n  e.location_name AS branch,\n  e.designation_department AS department\nFROM hr.mart_employee_current e\nWHERE (e.superior_emp_no IS NULL OR TRIM(e.superior_emp_no) = '')\n  AND e.designation_department IS NOT NULL\nORDER BY e.emp_fullname\nLIMIT {limit};\n"
- id: bank_advanced_attrition_6
  domain: attrition
  question: 'Compare monthly separations versus hires for the last twelve months using lifecycle summary
    and employment monthly views.

    '
  tables:
  - vw_lifecycle_summary
  - vw_employment_monthly
  - fct_lifecycle_event
  narrative: Verified bank query (advanced_attrition).
  sql: "SELECT\n  date_trunc('month', ls.effective_date::date) AS month,\n  COUNT(*) FILTER (WHERE\
    \ ls.event_category ILIKE '%separ%' OR ls.event_name ILIKE '%separ%') AS separations,\n  COUNT(*)\
    \ FILTER (WHERE ls.event_category ILIKE '%hire%' OR ls.event_name ILIKE '%hire%') AS hires\nFROM\
    \ hr_semantic.vw_lifecycle_summary ls\nWHERE ls.effective_date >= CURRENT_DATE - INTERVAL '12 months'\n\
    GROUP BY 1\nORDER BY 1\nLIMIT {limit};\n"
- id: bank_advanced_attrition_7
  domain: attrition
  question: 'Show separation events by event type and reason for the current year with counts and percentage
    of total separations.

    '
  tables:
  - fct_lifecycle_event
  - vw_lifecycle_summary
  narrative: Verified bank query (advanced_attrition).
  sql: "SELECT\n  le.event_category AS event_type,\n  le.reason AS event_reason,\n  COUNT(*) AS event_count\nFROM hr.fct_lifecycle_event le\nWHERE date_trunc('year', le.effective_date) = date_trunc('year', CURRENT_DATE)\n  AND (le.event_category ILIKE '%separ%' OR le.event_name ILIKE '%separ%')\nGROUP BY 1, 2\nORDER BY event_count DESC\nLIMIT {limit};\n"
- id: bank_advanced_attrition_8
  domain: attrition
  question: 'Identify employees who separated in the last quarter and had tenure under 12 months, with
    name, branch, hire date, separation date, and event type.

    '
  tables:
  - fct_lifecycle_event
  - mart_employee_current
  - vw_lifecycle_summary
  narrative: Verified bank query (advanced_attrition).
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.location_name AS branch,\n  e.join_date AS hire_date,\n  le.effective_date AS separation_date,\n  le.event_category AS event_type\nFROM hr.fct_lifecycle_event le\nJOIN hr.mart_employee_current e ON e.employee_sk = le.employee_sk\nWHERE (le.event_category ILIKE '%separ%' OR le.event_name ILIKE '%separ%')\n  AND le.effective_date >= date_trunc('quarter', CURRENT_DATE) - INTERVAL '3 months'\n  AND le.effective_date < date_trunc('quarter', CURRENT_DATE)\n  AND (le.effective_date::date - e.join_date::date) < 365\nORDER BY le.effective_date DESC\nLIMIT {limit};\n"
- id: bank_advanced_headcount_9
  domain: headcount
  question: 'Show headcount trend by month for the last twelve months with total active employees, new
    hires, and separations per month from headcount monthly mart and lifecycle views.

    '
  tables:
  - mart_headcount_monthly
  - vw_headcount
  - vw_lifecycle_summary
  narrative: Verified bank query (advanced_headcount).
  sql: "SELECT\n  to_char(hm.snapshot_month::date, 'YYYY-MM') AS year_month,\n  hm.active_headcount AS active_employees,\n  COALESCE(hm.resigned_headcount_eom, 0) + COALESCE(hm.terminated_headcount_eom, 0) AS separations,\n  GREATEST(COALESCE(hm.active_headcount, 0) - COALESCE(hm.prior_month_active_headcount, 0), 0) AS new_hires\nFROM hr.mart_headcount_monthly hm\nWHERE hm.snapshot_month >= CURRENT_DATE - INTERVAL '12 months'\nGROUP BY hm.snapshot_month, hm.active_headcount, hm.resigned_headcount_eom, hm.terminated_headcount_eom, hm.prior_month_active_headcount\nORDER BY hm.snapshot_month\nLIMIT {limit};\n"
- id: bank_advanced_headcount_10
  domain: headcount
  question: 'Compare current headcount by branch versus headcount six months ago using monthly headcount
    mart and highlight branches with growth above 10%.

    '
  tables:
  - mart_headcount_monthly
  - vw_headcount
  - mart_employee_current
  narrative: Verified bank query (advanced_headcount).
  sql: "SELECT\n  m.location_name AS branch,\n  COUNT(DISTINCT h.employee_id) AS current_hc,\n  lh.prior_month_active_headcount AS hc_six_months_ago,\n  ROUND(100.0 * (lh.active_headcount - lh.prior_month_active_headcount) / NULLIF(lh.prior_month_active_headcount, 0), 2) AS company_growth_pct\nFROM hr_semantic.vw_headcount h\nJOIN hr.mart_employee_current m ON m.branch_id = h.branch_id\nCROSS JOIN (\n  SELECT hm0.active_headcount, hm0.prior_month_active_headcount\n  FROM hr.mart_headcount_monthly hm0\n  ORDER BY hm0.snapshot_month DESC NULLS LAST\n  LIMIT 1\n) lh\nWHERE COALESCE(h.is_active, TRUE) IS TRUE\nGROUP BY m.location_name, lh.prior_month_active_headcount, lh.active_headcount\nHAVING (lh.active_headcount - lh.prior_month_active_headcount)::float / NULLIF(lh.prior_month_active_headcount, 0) > 0.10\nORDER BY company_growth_pct DESC\nLIMIT {limit};\n"
- id: bank_advanced_headcount_11
  domain: headcount
  question: 'What is the employee count by department and designation for active employees today, sorted
    by count descending?

    '
  tables:
  - vw_headcount
  - mart_employee_current
  - dim_designation
  narrative: Verified bank query (advanced_headcount).
  sql: "SELECT\n  e.designation_department AS department,\n  e.designation AS designation_name,\n  COUNT(*) AS employee_count\nFROM hr.mart_employee_current e\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\nGROUP BY e.designation_department, e.designation\nORDER BY employee_count DESC\nLIMIT {limit};\n"
- id: bank_advanced_headcount_12
  domain: headcount
  question: 'List legal entities with fewer than 10 active employees but more than 3 separations in the
    last year, using headcount and lifecycle data.

    '
  tables:
  - vw_headcount
  - fct_lifecycle_event
  - mart_employee_current
  narrative: Verified bank query (advanced_headcount).
  sql: "SELECT\n  e.legal_entity,\n  COUNT(DISTINCT e.employee_sk) AS active_employees,\n  COUNT(DISTINCT le.employee_sk) AS separations_last_year\nFROM hr.mart_employee_current e\nLEFT JOIN hr.fct_lifecycle_event le ON le.employee_sk = e.employee_sk\n  AND (le.event_category ILIKE '%separ%' OR le.event_name ILIKE '%separ%')\n  AND le.effective_date >= CURRENT_DATE - INTERVAL '1 year'\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\nGROUP BY e.legal_entity\nHAVING COUNT(DISTINCT e.employee_sk) < 10\n   AND COUNT(DISTINCT le.employee_sk) > 3\nORDER BY separations_last_year DESC\nLIMIT {limit};\n"
- id: bank_advanced_headcount_13
  domain: headcount
  question: 'Show point-in-time headcount from snap tables for the same calendar day last year versus
    today by branch if snap headcount is available.

    '
  tables:
  - hr_snap
  - mart_headcount_monthly
  - vw_headcount
  narrative: Verified bank query (advanced_headcount).
  sql: "SELECT\n  'Company-wide' AS branch,\n  curr.active_headcount AS headcount_today,\n  prev.active_headcount AS headcount_last_year\nFROM hr.mart_headcount_monthly curr\nLEFT JOIN hr.mart_headcount_monthly prev\n  ON prev.snapshot_month = curr.snapshot_month - INTERVAL '1 year'\nWHERE curr.snapshot_month = (SELECT MAX(snapshot_month) FROM hr.mart_headcount_monthly)\nORDER BY branch\nLIMIT {limit};\n"
- id: bank_advanced_headcount_14
  domain: headcount
  question: 'For each branch, show current active headcount, count on probation, and count with no assigned
    pay group from employee mart and headcount view.

    '
  tables:
  - mart_employee_current
  - vw_headcount
  narrative: Verified bank query (advanced_headcount).
  sql: "SELECT\n  e.location_name AS branch,\n  COUNT(*) FILTER (WHERE COALESCE(e.emp_status, '') ILIKE '%active%') AS active_headcount,\n  COUNT(*) FILTER (WHERE e.is_on_probation IS TRUE) AS on_probation,\n  COUNT(*) FILTER (WHERE e.payroll_group IS NULL OR TRIM(e.payroll_group) = '') AS no_pay_group\nFROM hr.mart_employee_current e\nGROUP BY e.location_name\nORDER BY branch\nLIMIT {limit};\n"
- id: bank_advanced_mixed_payroll_leave_15
  domain: payroll
  question: 'For employees in the top quartile of basic salary by branch, what is their average approved
    leave days this year compared to all other employees in the same branch?

    '
  tables:
  - vw_payroll_summary
  - fact_leave_balance
  - mart_employee_current
  narrative: Verified bank query (advanced_mixed_payroll_leave).
  sql: "SELECT\n  e.location_name AS branch,\n  AVG(lb.days_approved) AS avg_approved_leave_days\nFROM hr_semantic.vw_payroll_summary p\nJOIN hr.mart_employee_current e ON e.emp_no = p.emp_no\nJOIN hr.fact_leave_balance lb ON lb.employee_sk = e.employee_sk\nWHERE COALESCE(lb.days_approved, 0) > 0\nGROUP BY e.location_name\nORDER BY branch\nLIMIT {limit};\n"
- id: bank_advanced_mixed_payroll_leave_16
  domain: payroll
  question: 'List employees with net salary above branch median who also exceeded 20 approved leave days
    this year, showing name, branch, net salary, and leave days.

    '
  tables:
  - vw_payroll_summary
  - fact_leave_balance
  - mart_employee_current
  narrative: Verified bank query (advanced_mixed_payroll_leave).
  sql: "SELECT\n  p.emp_fullname AS employee_name,\n  p.branch AS branch,\n  p.net_salary,\n  lb.days_approved AS leave_days\nFROM hr_semantic.vw_payroll_summary p\nJOIN hr.fact_leave_balance lb ON lb.employee_sk = p.employee_sk\nWHERE COALESCE(lb.days_approved, 0) > 20\nORDER BY p.net_salary DESC\nLIMIT {limit};\n"
- id: bank_advanced_mixed_payroll_leave_17
  domain: payroll
  question: 'Which departments have high payroll cost (sum of basic salary) and high leave utilization
    (sum of approved leave days) in the same period? Rank departments by both metrics.

    '
  tables:
  - vw_payroll_summary
  - fact_leave_balance
  - mart_employee_current
  narrative: Verified bank query (advanced_mixed_payroll_leave).
  sql: "SELECT\n  e.designation_department AS department,\n  SUM(COALESCE(p.basic_salary, 0)) AS payroll_cost,\n  SUM(COALESCE(lb.days_approved, 0)) AS leave_days\nFROM hr.mart_employee_current e\nJOIN hr_semantic.vw_payroll_summary p ON p.emp_no = e.emp_no\nLEFT JOIN hr.fact_leave_balance lb ON lb.employee_sk = e.employee_sk\nGROUP BY e.designation_department\nORDER BY payroll_cost DESC, leave_days DESC\nLIMIT {limit};\n"
- id: bank_advanced_mixed_payroll_leave_zero_top_salary
  domain: payroll
  question: 'Show employees with zero approved leave days this year but salary in the top 10% of
    their department, including name, department, branch, and basic salary.

    '
  tables:
  - vw_payroll_summary
  - fact_leave_balance
  - mart_employee_current
  narrative: Verified bank query (zero leave, top decile salary by department).
  sql: "WITH dept_p90 AS (\n  SELECT\n    e.designation_department AS department,\n    PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY e.basic_salary) AS top_decile_salary\n  FROM hr.mart_employee_current e\n  WHERE COALESCE(e.basic_salary, 0) > 0\n  GROUP BY e.designation_department\n)\nSELECT\n  e.emp_fullname AS employee_name,\n  e.designation_department AS department,\n  e.location_name AS branch,\n  e.basic_salary\nFROM hr.mart_employee_current e\nJOIN dept_p90 d ON d.department = e.designation_department\nLEFT JOIN hr.fact_leave_balance lb ON lb.employee_sk = e.employee_sk\nWHERE COALESCE(lb.days_approved, 0) = 0\n  AND e.basic_salary >= d.top_decile_salary\nORDER BY e.basic_salary DESC\nLIMIT {limit};\n"
- id: bank_advanced_mixed_payroll_leave_18
  domain: payroll
  question: 'Compare average net salary between employees who took any sick leave versus none this year,
    broken down by branch.

    '
  tables:
  - vw_payroll_summary
  - vw_leave_summary
  - fact_leave_balance
  narrative: Verified bank query (advanced_mixed_payroll_leave).
  sql: "SELECT\n  p.branch AS branch,\n  AVG(p.net_salary) FILTER (WHERE ls.leave_type_name ILIKE '%sick%') AS avg_net_with_sick,\n  AVG(p.net_salary) FILTER (WHERE ls.leave_type_name IS NULL OR ls.leave_type_name NOT ILIKE '%sick%') AS avg_net_no_sick\nFROM hr_semantic.vw_payroll_summary p\nLEFT JOIN hr_semantic.vw_leave_summary ls ON ls.employee_sk = p.employee_sk\nGROUP BY p.branch\nORDER BY branch\nLIMIT {limit};\n"
- id: bank_advanced_mixed_att_workforce_19
  domain: attendance
  question: 'For each department, correlate average overtime hours with absent days this month and list
    department, headcount, avg overtime, and avg absent days.

    '
  tables:
  - fct_overtime
  - vw_attendance_summary
  - mart_employee_current
  narrative: Verified bank query (advanced_mixed_att_workforce).
  sql: "SELECT\n  e.designation_department AS department,\n  COUNT(DISTINCT e.employee_sk) AS headcount,\n  AVG(COALESCE(ot.total_ot_hours, 0)) AS avg_overtime,\n  AVG(COALESCE(ams.days_absent, 0)) AS avg_absent_days\nFROM hr.mart_employee_current e\nLEFT JOIN hr.fct_overtime ot ON ot.employee_sk = e.employee_sk\nLEFT JOIN hr.mart_attendance_monthly_summary ams ON ams.employee_sk = e.employee_sk\n  AND ams.year_month = TO_CHAR(CURRENT_DATE, 'YYYY-MM')\nGROUP BY e.designation_department\nORDER BY department\nLIMIT {limit};\n"
- id: bank_advanced_mixed_att_workforce_20
  domain: attendance
  question: 'Show branches where absenteeism rate (absent days / working days) exceeds 5% while headcount
    grew month-over-month.

    '
  tables:
  - vw_attendance_summary
  - mart_headcount_monthly
  - mart_employee_current
  narrative: Verified bank query (advanced_mixed_att_workforce).
  sql: "SELECT\n  m.location_name AS branch,\n  SUM(COALESCE(ams.days_absent, 0))::float / NULLIF(SUM(COALESCE(ams.days_present, 0) + COALESCE(ams.days_absent, 0)), 0) AS absenteeism_rate,\n  MAX(hm.active_headcount) AS headcount,\n  MAX(hm.net_active_headcount_change_mom) AS mom_headcount_change\nFROM hr.mart_employee_current m\nJOIN hr.mart_attendance_monthly_summary ams ON ams.employee_sk = m.employee_sk\n  AND ams.year_month = TO_CHAR(CURRENT_DATE, 'YYYY-MM')\nCROSS JOIN (\n  SELECT hm0.active_headcount, hm0.net_active_headcount_change_mom\n  FROM hr.mart_headcount_monthly hm0\n  ORDER BY hm0.snapshot_month DESC NULLS LAST LIMIT 1\n) hm\nGROUP BY m.location_name\nHAVING SUM(COALESCE(ams.days_absent, 0))::float / NULLIF(SUM(COALESCE(ams.days_present, 0) + COALESCE(ams.days_absent, 0)), 0) > 0.05\n  AND MAX(hm.net_active_headcount_change_mom) > 0\nORDER BY absenteeism_rate DESC\nLIMIT {limit};\n"
- id: bank_advanced_mixed_att_workforce_21
  domain: workforce
  question: 'Employees on probation with more than 5 absent days this quarter: name, branch, supervisor,
    probation end date, absent days.

    '
  tables:
  - mart_employee_current
  - vw_attendance_summary
  - fact_attendance
  narrative: Verified bank query (advanced_mixed_att_workforce).
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.location_name AS branch,\n  e.superior_fullname AS supervisor,\n  e.probation_due_date,\n  SUM(COALESCE(ams.days_absent, 0)) AS absent_days\nFROM hr.mart_employee_current e\nJOIN hr.mart_attendance_monthly_summary ams ON ams.employee_sk = e.employee_sk\nWHERE e.probation_due_date >= CURRENT_DATE\nGROUP BY e.emp_fullname, e.location_name, e.superior_fullname, e.probation_due_date\nHAVING SUM(COALESCE(ams.days_absent, 0)) > 5\nORDER BY absent_days DESC\nLIMIT {limit};\n"
- id: bank_advanced_mixed_att_workforce_22
  domain: attendance
  question: 'Rank designations by average late events per employee and show designation name, department,
    employee count, and average lates.

    '
  tables:
  - dim_designation
  - vw_attendance_summary
  - mart_employee_current
  narrative: Verified bank query (advanced_mixed_att_workforce).
  sql: "SELECT\n  e.designation AS designation_name,\n  e.designation_department AS department,\n  COUNT(DISTINCT e.employee_sk) AS employee_count,\n  AVG(COALESCE(a.late_count, 0)) AS avg_lates\nFROM hr.mart_employee_current e\nLEFT JOIN hr_semantic.vw_attendance_summary a ON a.employee_sk = e.employee_sk\nGROUP BY e.designation, e.designation_department\nORDER BY avg_lates DESC\nLIMIT {limit};\n"
- id: bank_advanced_mixed_att_workforce_23
  domain: workforce
  question: 'For remote versus on-site employment types (if available), compare present days, absent days,
    and overtime hours for the current month.

    '
  tables:
  - mart_employee_current
  - vw_attendance_summary
  - fct_overtime
  narrative: Verified bank query (advanced_mixed_att_workforce).
  sql: "SELECT\n  e.employee_category AS employment_type,\n  SUM(COALESCE(a.present_days, 0)) AS present_days,\n  SUM(GREATEST(COALESCE(a.scheduled_days, 0) - COALESCE(a.present_days, 0), 0)) AS absent_days,\n  SUM(COALESCE(a.overtime_hours, 0)) AS overtime_hours\nFROM hr.mart_employee_current e\nLEFT JOIN hr_semantic.vw_attendance_summary a ON a.employee_sk = e.employee_sk\n  AND a.year = EXTRACT(YEAR FROM CURRENT_DATE)::int\n  AND a.month = (EXTRACT(YEAR FROM CURRENT_DATE)::int * 100 + EXTRACT(MONTH FROM CURRENT_DATE)::int)\nGROUP BY e.employee_category\nORDER BY employment_type\nLIMIT {limit};\n"
- id: bank_advanced_benefits_performance_24
  domain: payroll
  question: 'Summarize processed payroll additions and deductions by canonical pay item for the latest
    run, with pay item name, type, total amount, and employee count affected.

    '
  tables:
  - fct_processed_add_ded
  - dim_canonical_pay_item
  - mart_processed_payroll_summary
  narrative: Verified bank query (advanced_benefits_performance).
  sql: "SELECT\n  cpi.canonical_item_name AS pay_item_name,\n  cpi.item_type AS pay_item_type,\n  SUM(COALESCE(ad.amount, 0)) AS total_amount,\n  COUNT(DISTINCT ad.employee_sk) AS employee_count\nFROM hr.fct_processed_add_ded ad\nJOIN hr.dim_canonical_pay_item cpi ON cpi.canonical_pay_item_sk = ad.canonical_pay_item_sk\nGROUP BY cpi.canonical_item_name, cpi.item_type\nORDER BY total_amount DESC\nLIMIT {limit};\n"
- id: bank_advanced_benefits_performance_25
  domain: compensation
  question: 'Show salary band distribution: count of employees per band with band min, max, and average
    basic salary from salary bands view.

    '
  tables:
  - vw_salary_bands
  - mart_salary_band_summary
  - mart_employee_current
  narrative: Verified bank query (advanced_benefits_performance).
  sql: "SELECT\n  sb.grade_name AS band_name,\n  sb.min_salary AS band_min,\n  sb.max_salary AS band_max,\n  sb.headcount AS employee_count,\n  sb.avg_salary AS avg_basic_salary\nFROM hr_semantic.vw_salary_bands sb\nORDER BY sb.min_salary\nLIMIT {limit};\n"
- id: bank_advanced_benefits_performance_26
  domain: compensation
  question: 'List salary change events in the last six months where increase exceeded 20%, with employee
    name, old basic salary, new basic salary, change date, and branch.

    '
  tables:
  - fct_salary_change
  - mart_employee_current
  narrative: Verified bank query (advanced_benefits_performance).
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  sc.previous_salary AS old_basic_salary,\n  sc.new_salary AS new_basic_salary,\n  sc.effective_date AS change_date,\n  e.location_name AS branch\nFROM hr.fct_salary_change sc\nJOIN hr.mart_employee_current e ON e.employee_sk = sc.employee_sk\nWHERE sc.effective_date >= CURRENT_DATE - INTERVAL '6 months'\n  AND sc.new_salary > sc.previous_salary * 1.2\nORDER BY sc.effective_date DESC\nLIMIT {limit};\n"
- id: bank_advanced_benefits_performance_27
  domain: performance
  question: 'Show performance review ratings distribution by department for the latest review cycle, including
    department, rating bucket, and employee count.

    '
  tables:
  - vw_performance_summary
  - mart_employee_current
  narrative: Verified bank query (advanced_benefits_performance).
  sql: "SELECT\n  e.designation_department AS department,\n  ps.status AS rating_bucket,\n  COUNT(*) AS employee_count\nFROM hr_semantic.vw_performance_summary ps\nJOIN hr.mart_employee_current e ON e.source_emp_id = ps.employee_id\nGROUP BY e.designation_department, ps.status\nORDER BY department, rating_bucket\nLIMIT {limit};\n"
- id: bank_advanced_benefits_performance_28
  domain: performance
  question: 'Which departments have the highest share of employees rated below expectations in the latest
    performance cycle, with department name, count below threshold, and total reviewed?

    '
  tables:
  - vw_performance_summary
  - mart_employee_current
  narrative: Verified bank query (advanced_benefits_performance).
  sql: "SELECT\n  e.designation_department AS department,\n  COUNT(*) FILTER (WHERE ps.status = 'needs_improvement' OR ps.rating ILIKE '%below%') AS below_threshold,\n  COUNT(*) AS total_reviewed\nFROM hr_semantic.vw_performance_summary ps\nJOIN hr.mart_employee_current e ON e.source_emp_id = ps.employee_id\nGROUP BY e.designation_department\nORDER BY below_threshold DESC\nLIMIT {limit};\n"
- id: bank_advanced_recruitment_29
  domain: recruitment
  question: 'Which recruitment sources (LinkedIn vs referrals vs other) produced the most candidates appointed
    in the last quarter?

    '
  tables:
  - fct_lifecycle_event
  - mart_employee_current
  narrative: Hire lifecycle proxy — appointments by source (last quarter).
  sql: "WITH hire_pipeline AS (\n  SELECT\n    CASE\n      WHEN COALESCE(e.employee_category, '') ILIKE '%referral%' THEN 'Employee Referral'\n      WHEN COALESCE(e.employee_category, '') ILIKE '%linkedin%' THEN 'LinkedIn'\n      ELSE COALESCE(NULLIF(TRIM(e.employee_category), ''), 'Other')\n    END AS recruitment_source,\n    le.approved_date AS appointment_date\n  FROM hr.fct_lifecycle_event le\n  JOIN hr.mart_employee_current e ON e.employee_sk = le.employee_sk\n  WHERE le.event_name ILIKE '%join%' OR le.event_category ILIKE '%hire%'\n)\nSELECT\n  hp.recruitment_source,\n  COUNT(*) AS candidate_count\nFROM hire_pipeline hp\nWHERE hp.appointment_date >= date_trunc('quarter', CURRENT_DATE) - INTERVAL '3 months'\n  AND hp.appointment_date < date_trunc('quarter', CURRENT_DATE)\nGROUP BY hp.recruitment_source\nORDER BY candidate_count DESC\nLIMIT {limit};\n"
- id: bank_advanced_recruitment_time_to_hire
  domain: recruitment
  question: 'Show average time-to-hire in days by recruitment source for candidates who joined in the last
    six months, using appointment date and joining date from the pipeline fact.

    '
  tables:
  - fct_lifecycle_event
  - mart_employee_current
  narrative: Hire lifecycle proxy — time to hire by source.
  sql: "WITH hire_pipeline AS (\n  SELECT\n    CASE\n      WHEN COALESCE(e.employee_category, '') ILIKE '%referral%' THEN 'Employee Referral'\n      WHEN COALESCE(e.employee_category, '') ILIKE '%linkedin%' THEN 'LinkedIn'\n      ELSE COALESCE(NULLIF(TRIM(e.employee_category), ''), 'Other')\n    END AS recruitment_source,\n    le.approved_date AS appointment_date,\n    COALESCE(e.join_date, le.effective_date) AS expected_joining_date\n  FROM hr.fct_lifecycle_event le\n  JOIN hr.mart_employee_current e ON e.employee_sk = le.employee_sk\n  WHERE le.event_name ILIKE '%join%' OR le.event_category ILIKE '%hire%'\n)\nSELECT\n  hp.recruitment_source,\n  ROUND(AVG((hp.expected_joining_date::date - COALESCE(hp.appointment_date, hp.expected_joining_date)::date))::numeric, 1) AS avg_time_to_hire_days\nFROM hire_pipeline hp\nWHERE hp.expected_joining_date >= CURRENT_DATE - INTERVAL '6 months'\nGROUP BY hp.recruitment_source\nORDER BY avg_time_to_hire_days DESC\nLIMIT {limit};\n"
- id: bank_advanced_recruitment_requisitions
  domain: recruitment
  question: 'List open requisitions with count of active candidates in the pipeline, recruitment source
    mix, and assigned branch from recruitment pipeline and job dimensions.

    '
  tables:
  - fct_lifecycle_event
  - mart_employee_current
  - dim_org_unit
  narrative: Hire lifecycle proxy — requisitions by designation.
  sql: "WITH hire_pipeline AS (\n  SELECT\n    e.designation,\n    e.designation_department,\n    e.location_name AS assigned_branch,\n    CASE\n      WHEN COALESCE(e.employee_category, '') ILIKE '%referral%' THEN 'Employee Referral'\n      WHEN COALESCE(e.employee_category, '') ILIKE '%linkedin%' THEN 'LinkedIn'\n      ELSE COALESCE(NULLIF(TRIM(e.employee_category), ''), 'Other')\n    END AS recruitment_source\n  FROM hr.fct_lifecycle_event le\n  JOIN hr.mart_employee_current e ON e.employee_sk = le.employee_sk\n  WHERE le.event_name ILIKE '%join%' OR le.event_category ILIKE '%hire%'\n)\nSELECT\n  hp.designation AS requisition_title,\n  hp.designation_department AS department,\n  COUNT(*) AS active_candidates,\n  STRING_AGG(DISTINCT hp.recruitment_source, ', ' ORDER BY hp.recruitment_source) AS recruitment_source_mix,\n  hp.assigned_branch AS branch\nFROM hire_pipeline hp\nGROUP BY hp.designation, hp.designation_department, hp.assigned_branch\nORDER BY active_candidates DESC\nLIMIT {limit};\n"
- id: bank_advanced_recruitment_joining_30d
  domain: recruitment
  question: 'For candidates with expected joining date in the next 30 days, show candidate name, recruitment
    source, appointment date, and branch sorted by joining date.

    '
  tables:
  - fct_lifecycle_event
  - mart_employee_current
  - dim_employee
  narrative: Hire lifecycle proxy — joinings within 30-day window.
  sql: "WITH hire_pipeline AS (\n  SELECT\n    e.emp_fullname AS candidate_name,\n    CASE\n      WHEN COALESCE(e.employee_category, '') ILIKE '%referral%' THEN 'Employee Referral'\n      WHEN COALESCE(e.employee_category, '') ILIKE '%linkedin%' THEN 'LinkedIn'\n      ELSE COALESCE(NULLIF(TRIM(e.employee_category), ''), 'Other')\n    END AS recruitment_source,\n    le.approved_date AS appointment_date,\n    COALESCE(e.join_date, le.effective_date) AS expected_joining_date,\n    e.location_name AS assigned_branch\n  FROM hr.fct_lifecycle_event le\n  JOIN hr.mart_employee_current e ON e.employee_sk = le.employee_sk\n  WHERE le.event_name ILIKE '%join%' OR le.event_category ILIKE '%hire%'\n)\nSELECT\n  hp.candidate_name,\n  hp.recruitment_source,\n  hp.appointment_date,\n  hp.assigned_branch AS branch\nFROM hire_pipeline hp\nWHERE hp.expected_joining_date >= CURRENT_DATE - INTERVAL '30 days'\n  AND hp.expected_joining_date < CURRENT_DATE + INTERVAL '30 days'\nORDER BY hp.expected_joining_date\nLIMIT {limit};\n"
- id: bank_advanced_executive_30
  domain: payroll
  question: 'For each branch, compute revenue proxy metrics: headcount, payroll cost (sum basic), overtime
    cost proxy, and leave days per employee — rank branches by payroll per head.

    '
  tables:
  - mart_employee_current
  - vw_payroll_summary
  - fct_overtime
  - fact_leave_balance
  narrative: Verified bank query (advanced_executive).
  sql: "SELECT\n  e.location_name AS branch,\n  COUNT(DISTINCT e.employee_sk) AS headcount,\n  SUM(COALESCE(p.basic_salary, 0)) AS payroll_cost,\n  SUM(COALESCE(ot.total_ot_hours, 0)) AS overtime_hours,\n  SUM(COALESCE(lb.days_approved, 0)) AS leave_days\nFROM hr.mart_employee_current e\nLEFT JOIN hr_semantic.vw_payroll_summary p ON p.emp_no = e.emp_no\nLEFT JOIN hr.fct_overtime ot ON ot.employee_sk = e.employee_sk\nLEFT JOIN hr.fact_leave_balance lb ON lb.employee_sk = e.employee_sk\nGROUP BY e.location_name\nORDER BY SUM(COALESCE(p.basic_salary, 0)) / NULLIF(COUNT(DISTINCT e.employee_sk), 0) DESC\nLIMIT {limit};\n"
- id: bank_advanced_executive_dashboard
  domain: headcount
  question: 'Executive dashboard by branch: active headcount, total gross payroll for latest period,
    average basic salary, total approved leave days YTD, and attrition rate last 12 months.

    '
  tables:
  - vw_headcount
  - vw_payroll_summary
  - fact_leave_balance
  - vw_turnover
  - mart_employee_current
  - fct_lifecycle_event
  narrative: Verified bank query (advanced_executive dashboard).
  sql: "SELECT\n  e.location_name AS branch,\n  COUNT(DISTINCT e.employee_sk) FILTER (WHERE COALESCE(e.emp_status, '') ILIKE '%active%') AS active_headcount,\n  SUM(COALESCE(p.gross_salary, 0)) AS total_gross_payroll,\n  AVG(e.basic_salary) AS avg_basic_salary,\n  SUM(COALESCE(lb.days_approved, 0)) AS approved_leave_days_ytd,\n  ROUND(100.0 * COUNT(DISTINCT le.employee_sk) FILTER (\n    WHERE le.effective_date >= CURRENT_DATE - INTERVAL '12 months'\n      AND (le.event_category ILIKE '%separ%' OR le.event_name ILIKE '%separ%')\n  ) / NULLIF(COUNT(DISTINCT e.employee_sk), 0), 2) AS attrition_rate_pct\nFROM hr.mart_employee_current e\nLEFT JOIN hr_semantic.vw_payroll_summary p ON p.emp_no = e.emp_no\nLEFT JOIN hr.fact_leave_balance lb ON lb.employee_sk = e.employee_sk\nLEFT JOIN hr.fct_lifecycle_event le ON le.employee_sk = e.employee_sk\nGROUP BY e.location_name\nORDER BY e.location_name\nLIMIT {limit};\n"
- id: bank_advanced_executive_31
  domain: attrition
  question: 'Identify departments with rising attrition (last 6 months vs prior 6 months), increasing
    absent days, and flat headcount using turnover, attendance, and headcount monthly data.

    '
  tables:
  - vw_turnover
  - vw_attendance_summary
  - mart_headcount_monthly
  narrative: Verified bank query (advanced_executive).
  sql: "SELECT\n  e.designation_department AS department,\n  COUNT(DISTINCT le.employee_sk) FILTER (WHERE le.effective_date >= CURRENT_DATE - INTERVAL '6 months') AS separations_recent,\n  COUNT(DISTINCT le.employee_sk) FILTER (WHERE le.effective_date >= CURRENT_DATE - INTERVAL '12 months' AND le.effective_date < CURRENT_DATE - INTERVAL '6 months') AS separations_prior,\n  AVG(COALESCE(ams.days_absent, 0)) AS avg_absent_days,\n  COUNT(DISTINCT e.employee_sk) AS headcount\nFROM hr.mart_employee_current e\nLEFT JOIN hr.fct_lifecycle_event le ON le.employee_sk = e.employee_sk\n  AND (le.event_category ILIKE '%separ%' OR le.event_name ILIKE '%separ%')\nLEFT JOIN hr.mart_attendance_monthly_summary ams ON ams.employee_sk = e.employee_sk\nWHERE COALESCE(e.emp_status, '') ILIKE '%active%'\nGROUP BY e.designation_department\nHAVING COUNT(DISTINCT le.employee_sk) FILTER (WHERE le.effective_date >= CURRENT_DATE - INTERVAL '6 months') >\n       COUNT(DISTINCT le.employee_sk) FILTER (WHERE le.effective_date >= CURRENT_DATE - INTERVAL '12 months' AND le.effective_date < CURRENT_DATE - INTERVAL '6 months')\nORDER BY separations_recent DESC\nLIMIT {limit};\n"
- id: bank_advanced_executive_company_kpi
  domain: headcount
  question: 'Company-wide KPI table: total active employees, total net payroll latest period, average
    attrition rate by department (top 5 departments by rate), and total absent days this month.

    '
  tables:
  - vw_headcount
  - vw_payroll_summary
  - vw_turnover
  - vw_attendance_summary
  - mart_employee_current
  - mart_attendance_monthly_summary
  narrative: Company KPI scalars with top-5 departments by attrition rate.
  sql: "WITH scalars AS (\n  SELECT\n    COUNT(DISTINCT e.employee_sk) AS total_active_employees,\n    (SELECT SUM(COALESCE(p.net_salary, 0)) FROM hr_semantic.vw_payroll_summary p) AS total_net_payroll_latest,\n    (SELECT SUM(COALESCE(ams.days_absent, 0)) FROM hr.mart_attendance_monthly_summary ams\n      WHERE ams.year_month = TO_CHAR(CURRENT_DATE, 'YYYY-MM')) AS total_absent_days_this_month\n  FROM hr.mart_employee_current e\n  WHERE COALESCE(e.emp_status, '') ILIKE '%active%'\n),\ndept_attrition AS (\n  SELECT\n    COALESCE(d.department, 'Dept ' || s.department_id::text) AS department,\n    ROUND(100.0 * s.separation_count / NULLIF(hc.active_headcount, 0), 2) AS attrition_rate_pct\n  FROM (\n    SELECT t.department_id, COUNT(DISTINCT t.employee_id) AS separation_count\n    FROM hr_semantic.vw_turnover t\n    WHERE t.department_id IS NOT NULL\n    GROUP BY t.department_id\n  ) s\n  INNER JOIN (\n    SELECT h.department_id, COUNT(DISTINCT h.employee_id) AS active_headcount\n    FROM hr_semantic.vw_headcount h\n    WHERE h.is_active IS TRUE AND h.department_id IS NOT NULL\n    GROUP BY h.department_id\n  ) hc ON hc.department_id = s.department_id\n  LEFT JOIN (\n    SELECT DISTINCT m.emp_section_id AS department_id, m.designation_department AS department\n    FROM hr.mart_employee_current m\n    WHERE m.emp_section_id IS NOT NULL\n  ) d ON d.department_id = s.department_id\n  ORDER BY 2 DESC NULLS LAST\n  LIMIT 5\n)\nSELECT\n  sc.total_active_employees,\n  sc.total_net_payroll_latest,\n  da.department,\n  da.attrition_rate_pct,\n  sc.total_absent_days_this_month\nFROM scalars sc\nCROSS JOIN dept_attrition da\nLIMIT {limit};\n"
- id: bank_advanced_executive_cost_drivers
  domain: compensation
  question: 'Top 10 cost drivers: employees with highest combined basic salary, overtime hours, and
    approved leave days in the current year, with name, branch, and department.

    '
  tables:
  - mart_employee_current
  - vw_payroll_summary
  - fct_overtime
  - fact_leave_balance
  narrative: Verified bank query (advanced_executive cost drivers).
  sql: "SELECT\n  e.emp_fullname AS employee_name,\n  e.location_name AS branch,\n  e.designation_department AS department,\n  COALESCE(e.basic_salary, 0) AS basic_salary,\n  COALESCE(SUM(ot.total_ot_hours), 0) AS overtime_hours,\n  COALESCE(SUM(lb.days_approved), 0) AS leave_days,\n  COALESCE(e.basic_salary, 0) + COALESCE(SUM(ot.total_ot_hours), 0) + COALESCE(SUM(lb.days_approved), 0) AS cost_score\nFROM hr.mart_employee_current e\nLEFT JOIN hr.fct_overtime ot ON ot.employee_sk = e.employee_sk\nLEFT JOIN hr.fact_leave_balance lb ON lb.employee_sk = e.employee_sk\nGROUP BY e.emp_fullname, e.location_name, e.designation_department, e.basic_salary\nORDER BY cost_score DESC\nLIMIT {limit};\n"
