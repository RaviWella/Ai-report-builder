metrics:
  employee_count:
    description: Number of employees — COUNT distinct employee_id on dim_employee (or headcount on fact_employee_snapshot for a date).
    tables: [dim_employee, fact_employee_snapshot]
    grain: employee

  headcount:
    description: Active workforce count — prefer headcount from fact_employee_snapshot for a given snapshot_date; else COUNT on dim_employee.
    tables: [fact_employee_snapshot, dim_employee]
    grain: employee

  average_salary:
    description: Average basic salary — AVG(basic_salary) from fact_payroll_detail or dim_employee; join on employee_no or employee_id as available.
    tables: [fact_payroll_detail, dim_employee]
    grain: employee

  top_paid:
    description: Rank employees by basic_salary DESC with LIMIT N on fact_payroll_detail (latest pay period) or dim_employee.
    tables: [fact_payroll_detail, dim_employee]
    grain: employee

  total_gross_pay:
    description: Sum of gross_pay from fact_payroll_detail for a pay period (filter by pay_year, pay_month, pay_period).
    tables: [fact_payroll_detail]
    grain: pay_period

  total_net_pay:
    description: Sum of net_pay from fact_payroll_detail for a pay period.
    tables: [fact_payroll_detail]
    grain: pay_period

  leave_days_total:
    description: Sum leave_days from fact_leave_transaction; filter by leave_date or leave_apply_date and leave_status_name as needed.
    tables: [fact_leave_transaction, dim_leave_type, dim_employee]
    grain: employee

  absent_days_count:
    description: Count attendance rows where absent_flag is true, or sum absent days from fact_attendance.
    tables: [fact_attendance, dim_employee]
    grain: employee

  attrition_count:
    description: Count termination events from fact_attrition (termination_count or COUNT rows) by period, branch, or department.
    tables: [fact_attrition, dim_employee]
    grain: termination

  time_to_hire:
    description: Average or distribution of time_to_hire_days from fact_recruitment_pipeline for filled requisitions.
    tables: [fact_recruitment_pipeline]
    grain: requisition

  average_performance_rating:
    description: AVG(rating_score) or AVG(result_score) from fact_performance_review for a review cycle.
    tables: [fact_performance_review, dim_review_cycle, dim_employee]
    grain: employee

joins:
  - left_table: dim_employee
    left_column: employee_id
    right_table: fact_attendance
    right_column: employee_id
    purpose: Attendance punches and hours per employee.

  - left_table: dim_employee
    left_column: employee_no
    right_table: fact_payroll_detail
    right_column: employee_no
    purpose: Payroll lines and amounts per employee (payroll fact uses employee_no).

  - left_table: dim_employee
    left_column: employee_id
    right_table: fact_leave_transaction
    right_column: employee_id
    purpose: Leave transactions with employee master attributes.

  - left_table: fact_leave_transaction
    left_column: leave_type_id
    right_table: dim_leave_type
    right_column: leave_type_id
    purpose: Leave type name and entitlement on leave rows.

  - left_table: dim_employee
    left_column: employee_id
    right_table: fact_attrition
    right_column: employee_id
    purpose: Terminations and exit reasons with employee org attributes.

  - left_table: dim_employee
    left_column: employee_id
    right_table: fact_performance_review
    right_column: employee_id
    purpose: Performance ratings and review items per employee.

  - left_table: fact_performance_review
    left_column: review_cycle_id
    right_table: dim_review_cycle
    right_column: review_cycle_id
    purpose: Review cycle name and dates on performance facts.

  - left_table: fact_recruitment_pipeline
    left_column: candidate_id
    right_table: dim_candidate
    right_column: candidate_id
    purpose: Candidate profile on recruitment pipeline rows.

  - left_table: fact_recruitment_pipeline
    left_column: job_key
    right_table: dim_job
    right_column: job_key
    purpose: Job title and grade on requisitions (job_key is surrogate; use designation_id if keyed in allowlist).

  - left_table: dim_employee
    left_column: employee_id
    right_table: fact_employee_snapshot
    right_column: employee_id
    purpose: Historical headcount and compensation snapshots per employee.

  - left_table: fact_employee_snapshot
    left_column: snapshot_date_key
    right_table: dim_date
    right_column: date_key
    purpose: Calendar attributes for snapshot reporting (if date_key columns exist in allowlist).

  - left_table: mart_employee_current
    left_column: employee_sk
    right_table: fct_salary_bank_instruction
    right_column: employee_sk
    purpose: Salary bank account instructions per employee.

  - left_table: fct_salary_bank_instruction
    left_column: source_bank_id
    right_table: dim_bank
    right_column: source_bank_id
    purpose: Bank code and bank name for salary bank rows.

  - left_table: mart_employee_current
    left_column: employee_sk
    right_table: dim_employee
    right_column: employee_sk
    purpose: Current mart row aligned to dim_employee via employee_sk.

  - left_table: mart_employee_current
    left_column: employee_sk
    right_table: mart_processed_payroll_summary
    right_column: employee_sk
    purpose: Payroll amounts per employee and pay period.

  - left_table: mart_employee_current
    left_column: employee_sk
    right_table: vw_payroll_summary
    right_column: employee_sk
    purpose: Payslip-style payroll view per employee and period.

  - left_table: fact_leave_transaction
    left_column: leave_type_id
    right_table: dim_leave_type
    right_column: leave_type_id
    purpose: Leave type labels on transactions.

  - left_table: mart_employee_current
    left_column: employee_sk
    right_table: vw_attendance_summary
    right_column: employee_sk
    purpose: Attendance KPIs per employee.
