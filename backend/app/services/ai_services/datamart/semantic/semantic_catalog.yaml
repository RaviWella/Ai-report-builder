# MintHRM Datamart semantic catalog — aligned to HRIS product modules.
# Tables listed per topic reflect the current mart (public_mint_audit). Empty tables: []
# means the topic is keyword-ready; run semantic_catalog_tool refresh --write after mart upgrades.
# Physical columns must still appear in the grounded allowlist (Postgres introspection).

catalog_meta:
  mart_purpose: HR reporting datamart fed from the HRIS operational database
  join_key_conventions: |
    Prefer employee_sk between mart_employee_current, payroll marts/facts, bank, and leave.
    Use emp_no for employee number in results. source_emp_id is the HRIS key on dim_employee.
    Payroll period grain uses payroll_period_sk. Bank/org dims use source_*_id (cast ::text if needed).
  hris_modules:
    - loan
    - employee_information
    - employee_lifecycle
    - onboarding_offboarding
    - attendance
    - attendance_for_payroll
    - leave
    - payroll
    - benefit
    - recruitment
    - performance_learning_development
    - support_system
    - task_management
    - talent_management
    - past_data

