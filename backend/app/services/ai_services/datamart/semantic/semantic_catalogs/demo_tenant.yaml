metrics:
  employee_count:
    description: Number of employees — COUNT distinct employee_id on dim_employee (or headcount on fact_employee_snapshot
      for a date).
    tables:
    - dim_employee
    grain: employee
    verified_sql: 'SELECT COUNT(DISTINCT employee_id) AS employee_count

      FROM {schema}.dim_employee

      '
  headcount:
    description: Active workforce count — prefer headcount from fact_employee_snapshot for a given snapshot_date; else COUNT
      on dim_employee.
    tables:
    - dim_employee
    grain: employee
    verified_sql: 'SELECT COUNT(DISTINCT employee_id) AS headcount

      FROM {schema}.dim_employee

      '
  average_salary:
    description: Average basic salary — AVG(basic_salary) from fact_payroll_detail or dim_employee; join on employee_no or
      employee_id as available.
    tables:
    - dim_employee
    grain: employee
  top_paid:
    description: Rank employees by basic_salary DESC with LIMIT N on fact_payroll_detail (latest pay period) or dim_employee.
    tables:
    - dim_employee
    grain: employee
    verified_sql: 'SELECT e.full_name, p.basic_salary

      FROM {schema}.dim_employee e

      JOIN hr.fact_payroll_detail p ON e.employee_id = p.employee_id

      ORDER BY p.basic_salary DESC NULLS LAST

      LIMIT {limit}

      '
  total_gross_pay:
    description: Sum of gross_pay from fact_payroll_detail for a pay period (filter by pay_year, pay_month, pay_period).
    tables: []
    grain: pay_period
  total_net_pay:
    description: Sum of net_pay from fact_payroll_detail for a pay period.
    tables: []
    grain: pay_period
  leave_days_total:
    description: Sum leave_days from fact_leave_transaction; filter by leave_date or leave_apply_date and leave_status_name
      as needed.
    tables:
    - dim_employee
    grain: employee
  absent_days_count:
    description: Count attendance rows where absent_flag is true, or sum absent days from fact_attendance.
    tables:
    - fact_attendance
    - dim_employee
    grain: employee
  attendance_monthly_summary:
    description: Monthly attendance KPIs per employee from vw_attendance_summary (present days, late, OT hours).
    tables:
    - vw_attendance_summary
    - mart_attendance_monthly_summary
    - dim_employee
    grain: employee
  attrition_count:
    description: Count separations from vw_turnover (or fact_attrition) by period, branch, or department.
    tables:
    - vw_turnover
    - fct_lifecycle_event
    - dim_employee
    grain: termination
  attrition_rate:
    description: Turnover rate (separations / active headcount * 100) by department or branch. Compute from vw_turnover and
      vw_headcount — there is no physical attrition_rate column.
    tables:
    - vw_turnover
    - vw_headcount
    - mart_employee_current
    grain: department
  time_to_hire:
    description: Average or distribution of time_to_hire_days from fact_recruitment_pipeline for filled requisitions.
    tables: []
    grain: requisition
  average_performance_rating:
    description: AVG(rating_score) or AVG(result_score) from fact_performance_review for a review cycle.
    tables:
    - dim_employee
    grain: employee
joins:
- left_table: mart_employee_current
  left_column: employee_sk
  right_table: fct_salary_bank_instruction
  right_column: employee_sk
  purpose: Employee salary bank instructions (one or more accounts per employee).
- left_table: fct_salary_bank_instruction
  left_column: source_bank_id
  right_table: dim_bank
  right_column: source_bank_id
  purpose: Resolve bank code and bank name from salary bank instruction.
- left_table: fct_salary_bank_instruction
  left_column: source_bank_branch_id
  right_table: dim_bank_branch
  right_column: source_bank_branch_id
  purpose: Branch name for salary bank account when branch dimension is needed.
- left_table: mart_employee_current
  left_column: employee_sk
  right_table: mart_cost_to_company
  right_column: employee_sk
  purpose: Basic salary and total compensation (CTC) per employee.
- left_table: mart_employee_current
  left_column: employee_sk
  right_table: dim_employee
  right_column: employee_sk
  purpose: Current mart row to dim_employee history (same employee_sk).
- left_table: mart_employee_current
  left_column: employee_sk
  right_table: mart_processed_payroll_summary
  right_column: employee_sk
  purpose: Payroll amounts per pay period for current employees.
- left_table: mart_employee_current
  left_column: employee_sk
  right_table: vw_payroll_summary
  right_column: employee_sk
  purpose: AI-safe payroll view (payslip-style columns) per employee and period.
- left_table: mart_processed_payroll_summary
  left_column: payroll_period_sk
  right_table: dim_payroll_period
  right_column: payroll_period_sk
  purpose: Pay period start/end dates and labels on processed payroll.
