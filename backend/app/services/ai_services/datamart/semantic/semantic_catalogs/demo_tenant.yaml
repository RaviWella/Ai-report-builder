# Per-tenant semantic catalog (ETL warehouse: hr_semantic, hr, hr_snap).
# Generated: python tools/semantic_catalog_tool.py refresh --tenant demo_tenant --write

catalog_meta:
  mart_purpose: HR reporting datamart fed from the HRIS operational database
  join_key_conventions: 'Prefer employee_sk to join workforce marts (mart_employee_current), payroll facts/marts,

    bank instructions, leave balance, and processed payroll. Use emp_no for business employee number

    in SELECT lists (mart.emp_no), not dim_employee.employee_id. HRIS natural key is source_emp_id.

    Payroll period grain uses payroll_period_sk on fct_processed_* and mart_processed_payroll_summary.

    Bank and org dimensions use source_*_id keys (cast ::text when joining to facts).

    '
  hris_modules:
  - loan
  - employee_information
  - employee_lifecycle
  - onboarding_offboarding
  - attendance
  - attendance_for_payroll
  - leave
  - payroll
  - benefit
  - recruitment
  - performance_learning_development
  - support_system
  - task_management
  - talent_management
  - past_data
  tenant_id: demo_tenant
  derived_from: semantic_catalog.yaml
