# MintHRM-compatible PostgreSQL source — EDIT physical names to match your DB.
# Logical keys (left side under columns:) must stay the same; change values only.
profile: minthrm
variant: postgres

# Optional: source_schema: public

tables:
  emp_basic: hr_empbasic
  emp_contact: hr_empcontact
  employment: hr_employment
  emp_type: hr_emptype
  designation: hr_designation
  grade: hr_grade
  emp_category: hr_empcat
  legal_entity: hr_legal_entity
  branch: branch
  emp_department_view: vw_mint_emp_department
  company_hierarchy: company_hierarchy
  company_hierarchy_individual: company_hierarchy_individual
  leave_type: hr_leavetype
  leave_application: hr_leaveapplication
  leave_application_dates: hr_leaveapplication_dates
  lifecycle: hr_lifecycle
  lifecycle_position: hr_lifecycle_position
  attendance: hr_attedance
  payroll_groups: hr_payroll_groups
  payroll_basic: processed_sal_basic_data
  payroll_add_ded: processed_sal_add_ded
  payroll_attendance: processed_sal_attendance
  payroll_variable_add: prl_variableadditions_forsal
  payroll_variable_ded: prl_variabledeductions_forsal
  payroll_tax: processed_tax_data_for_employee
  payroll_overtime: prl_overtime
  payroll_loan: processed_loan_data
  payroll_installment: processed_installment_payment_data
  payroll_compliance_basic: processed_sal_basic_data_compliance
  payroll_compliance_attendance: processed_sal_attendance_compliance
  payroll_multi_currency: processed_multi_currency_for_emp_sal
  payroll_noncash: prl_processed_nonecash_benefits
  payroll_non_consider: processed_non_consider_pay_items
  payroll_analyze: prl_processed_salary_analyze
  prl_loan: prl_loan
  payroll_salary_retrieve: prl_salary_retrieve
  payroll_salary_bank_data: prl_salary_bank_data
  payroll_bank: bank
  payroll_bank_branch: mas_branch

columns:
  emp_basic:
    id: emp_id
    employee_code: emp_no
    name: emp_name
    full_name: emp_fullname
    gender: emp_gender
    date_of_birth: emp_dob
    national_id: emp_nic
    status: emp_status
    last_resigned_date: last_resigned_date
    terminate_effectivedate: terminate_effectivedate
    legal_entity_id: ref_legal_entity_id
    legal_entity_ref: ref_legal_entity
    basic_salary: basicsalary
    epf_no: epf_no
    modified_date: modified_date
    create_date: create_date
  emp_contact:
    ref_emp_id: ref_emp_id
    email: emp_email
    mobile1: emp_mob1
    mobile2: emp_mob2
  employment:
    id: employment_id
    ref_emp_id: ref_emp_id
    section_id: emp_section_id
    designation_id: ref_desig_id
    grade_id: ref_grade_id
    category_id: ref_empcat_id
    branch_id: branch_id
    employment_type_id: ref_etype_id
    join_date: emp_jdate
    superior_id: superior_id
  emp_type:
    id: etype_id
    name: emp_type
  designation:
    id: desig_id
    title: designation
    department_ref: ref_desig_deprt
  grade:
    id: grade_id
    title: grade_title
  emp_category:
    id: empcat_id
    title: cat_title
  legal_entity:
    id: legal_entity_id
    title: legal_entity_title
    code: legal_entity_code
  branch:
    id: br_id
    name: br_name
    active: br_active
  emp_department_view:
    emp_id: emp_id
    department_name: department
  company_hierarchy:
    id: id
    code: hierarchy_section_code
    name: hierarchy_section_name
    parent_id: parent_id
    leader_id: ref_leader_id
  company_hierarchy_individual:
    id: id
    ref_emp_id: ref_emp_id
    parent_id: parent_id
  attendance:
    emp_id: ref_emp_id
    date: date
    punch_in: punch_in
    punch_out: punch_out
    work_minutes: work_minutes
    shift_minutes: shift_minutes
    shift_intime: shift_intime
    intime: intime
    shift_id: ref_shift_id
  payroll_salary_retrieve:
    id: retrieve_id
    ref_emp_id: ref_emp_id
    is_bank: is_bank
    modified_date: prl_salary_update_date
  # prl_salary_bank_data PK is bank_id (not id)
  payroll_salary_bank_data:
    id: bank_id
    ref_retrieve_id: ref_retrieve_id
    bank_id: bank_name
    bank_branch_id: bank_branch
    bank_acc_no: bank_acc_no
    bank_amount: bank_amount
    bank_passbook_name: bank_passbook_name
    is_primary_account: is_primary_account
    modified_date: prl_salary_bank_update_date
  payroll_bank:
    id: id
    bank_code: bank_code
    bank_name: bank_name
    modified_date: bank_update_date
    create_date: bank_create_date
  payroll_bank_branch:
    id: id
    ref_bank_id: ref_bank_id
    branch_code: branch_code
    branch_name: branch_name
    modified_date: branch_update_date
    create_date: branch_create_date
