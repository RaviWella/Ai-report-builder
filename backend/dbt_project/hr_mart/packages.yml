packages:
  # Surrogate keys, unique combination tests, date spine, schema tests
  - package: dbt-labs/dbt_utils
    version: 1.3.0

  # Rich expectation-style tests (expect_column_values_to_be_between, etc.)
  # Note: moved from calogica/ → metaplane/ (upstream rename)
  - package: metaplane/dbt_expectations
    version: 0.10.4

  # Code generation helpers — `dbt run-operation generate_source` is gold
  # for bootstrapping the sources.yml from your raw schema
  - package: dbt-labs/codegen
    version: 0.12.1

  # Automatic artifacts table (run results, test results, model timings)
  # for populating the audit schema
  - package: brooklyn-data/dbt_artifacts
    version: 2.10.0
