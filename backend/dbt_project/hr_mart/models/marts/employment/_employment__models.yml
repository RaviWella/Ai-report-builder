# Structural changes (new/renamed models, grains, FKs): update docs/datamart-er.yml
# and run: python backend/tools/generate_hr_er_pdf.py --check
version: 2

models:
  - name: dim_employee
    description: >
      SCD Type 2 employee dimension. One row per (tenant_id, source_emp_id, version).
      Built on snap_employee. Every fact table joins here via employee_sk.
      is_current = true selects the latest version per employee.
    columns:
      - name: employee_sk
        description: Surrogate key — unique per (tenant_id, source_system, source_emp_id, valid_from).
        tests:
          - unique
          - not_null
      - name: tenant_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: source_emp_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: version_number
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_emp_id
            - is_current
          config:
            where: "is_current = true"

  - name: mart_employee_current
    description: >
      Denormalized current-state OBT for active employees only. Computed age,
      tenure, probation flags. The thing BI dashboards point at.
    columns:
      - name: source_emp_id
        description: Source PK; unique because mart filters to is_current AND emp_status='active'.
        tests:
          - unique
          - not_null
      - name: employee_sk
        description: FK to dim_employee.employee_sk.
        tests:
          - not_null
          - relationships:
              to: ref('dim_employee')
              field: employee_sk
      - name: tenant_id
        tests: [not_null]
      - name: emp_status
        description: Should always be 'active' for this mart.
        tests:
          - accepted_values:
              values: ['active']
      - name: tenure_bucket
        tests:
          - accepted_values:
              values: ['unknown', '< 1 year', '1-3 years', '3-5 years', '5-10 years', '10+ years']

  - name: dim_designation
    description: SCD Type 2 job title dimension from snap_designation.
    columns:
      - name: designation_sk
        tests: [unique, not_null]
      - name: source_desig_id
        tests: [not_null]
      - name: tenant_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_desig_id
            - is_current
          config:
            where: "is_current = true"

  - name: dim_org_unit
    description: Org hierarchy dimension from company_hierarchy / stg_departments.
    columns:
      - name: org_unit_sk
        tests: [unique, not_null]
      - name: source_hierarchy_id
        tests: [not_null]
      - name: tenant_id
        tests: [not_null]

  - name: fct_employment_snapshot
    description: >
      Monthly employment state at month-end with FKs to dim_employee,
      dim_designation (PIT), and dim_org_unit.
    columns:
      - name: employment_snapshot_sk
        tests: [unique, not_null]
      - name: employee_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_employee')
              field: employee_sk
      - name: snapshot_month
        tests: [not_null]
      - name: tenant_id
        tests: [not_null]
      - name: designation_sk
        tests:
          - relationships:
              to: ref('dim_designation')
              field: designation_sk
              config:
                where: "designation_sk is not null"
      - name: org_unit_sk
        tests:
          - relationships:
              to: ref('dim_org_unit')
              field: org_unit_sk
              config:
                where: "org_unit_sk is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - employee_sk
            - snapshot_month

  - name: dim_date
    description: Calendar dimension — day grain; month-start dates link to snapshot_month.
    columns:
      - name: date_sk
        tests: [unique, not_null]
      - name: calendar_date
        tests: [unique, not_null]

  - name: mart_headcount_monthly
    description: >
      Monthly tenant-level workforce snapshot from fct_employment_snapshot.
      Headcount and status splits are month-end (EOM) point-in-time.
    columns:
      - name: headcount_monthly_sk
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: snapshot_month
        tests: [not_null]
      - name: snapshot_month_sk
        description: dim_date.date_sk for the first calendar day of snapshot_month.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: active_headcount
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - snapshot_month

  - name: dim_shift
    description: SCD Type 2 shift dimension from snap_shift.
    columns:
      - name: shift_sk
        tests: [unique, not_null]
      - name: source_shift_id
        tests: [not_null]
      - name: tenant_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: version_number
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_shift_id
            - is_current
          config:
            where: "is_current = true"

  - name: fct_daily_attendance
    description: >
      Daily attendance fact (emp × shift_day × shift_order). Incremental delete+insert.
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: shift_day
        tests: [not_null]
      - name: employee_sk
        tests:
          - relationships:
              to: ref('dim_employee')
              field: employee_sk
              config:
                where: "employee_sk is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_atten_id
            - shift_order

  - name: fct_overtime
    description: >
      Overtime fact per employee × day (derived from attendance until prl_overtime is staged).
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: source_ot_id
        tests: [not_null]
      - name: source_emp_id
        tests: [not_null]
      - name: ot_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_ot_id

  - name: mart_attendance_monthly_summary
    description: Monthly per-employee attendance and OT rollups for BI dashboards.
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: employee_sk
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: month_number
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - employee_sk
            - year
            - month_number

  - name: mart_salary_band_summary
    description: >
      Current compensation bands by legal entity, designation, and grade (active employees).
    columns:
      - name: salary_band_sk
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]
      - name: headcount
        tests: [not_null]
      - name: avg_salary
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - legal_entity_name
            - designation_name
            - grade_name

  - name: fct_salary_change
    description: >
      Salary revision fact from hr_lifecycle pay-change rows. PIT join to dim_employee.
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: source_increment_id
        tests: [not_null]
      - name: effective_date
        tests: [not_null]
      - name: change_type
        tests: [not_null]
      - name: employee_sk
        tests:
          - relationships:
              to: ref('dim_employee')
              field: employee_sk
              config:
                where: "employee_sk is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_increment_id

  - name: fct_lifecycle_event
    description: >
      Career lifecycle fact (one row per event). PIT join to dim_employee on effective_date.
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: source_lifecycle_id
        tests: [not_null]
      - name: effective_date
        tests: [not_null]
      - name: event_category
        tests: [not_null]
      - name: employee_sk
        tests:
          - relationships:
              to: ref('dim_employee')
              field: employee_sk
              config:
                where: "employee_sk is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_lifecycle_id
