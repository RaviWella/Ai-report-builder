# Structural changes (new/renamed models, grains, FKs): update docs/datamart-er.yml
# and run: python backend/tools/generate_hr_er_pdf.py --check
version: 2

models:
  - name: stg_processed_sal_basic_data
    description: Finalized payroll snapshot staging (engine output, not recalculated).
    columns:
      - name: source_processed_salary_id
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]

  - name: dim_payroll_period
    description: Payroll calendar dimension (year × month × half).
    columns:
      - name: payroll_period_sk
        tests: [unique, not_null]
      - name: payroll_year
        tests: [not_null]
      - name: payroll_month
        tests: [not_null]
      - name: payroll_half
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - payroll_year
            - payroll_month
            - payroll_half

  - name: stg_hr_payroll_groups
    description: Payroll group master from hr_payroll_groups.
    columns:
      - name: source_payroll_group_id
        tests: [not_null]
      - name: tenant_id
        tests: [not_null]

  - name: dim_payroll_group
    description: Payroll processing group dimension (from hr_payroll_groups).
    columns:
      - name: payroll_group_sk
        tests: [unique, not_null]
      - name: source_payroll_group_id
        tests: [not_null, unique]
      - name: payroll_group_name
        tests: [not_null]

  - name: stg_prl_salary_retrieve
    description: Salary retrieve setup rows from prl_salary_retrieve.
    columns:
      - name: source_salary_retrieve_id
        tests: [unique, not_null]

  - name: stg_prl_salary_bank_data
    description: Salary bank account split rows from prl_salary_bank_data.
    columns:
      - name: source_salary_bank_data_id
        tests: [unique, not_null]
      - name: source_salary_retrieve_id
        tests: [not_null]

  - name: stg_bank
    description: Bank master staging from bank table.
    columns:
      - name: source_bank_id
        tests: [unique, not_null]

  - name: stg_mas_branch
    description: Bank branch staging from mas_branch table.
    columns:
      - name: source_bank_branch_id
        tests: [unique, not_null]

  - name: dim_bank
    description: Payroll bank dimension.
    columns:
      - name: bank_sk
        tests: [unique, not_null]
      - name: source_bank_id
        tests: [unique, not_null]

  - name: dim_bank_branch
    description: Payroll bank branch dimension.
    columns:
      - name: bank_branch_sk
        tests: [unique, not_null]
      - name: source_bank_branch_id
        tests: [unique, not_null]

  - name: dim_canonical_pay_item
    description: >
      Canonical mapping for dynamic payroll line labels (seed-driven; API extensible).
    columns:
      - name: canonical_pay_item_sk
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]
      - name: source_item_name
        tests: [not_null, unique]
      - name: canonical_item_name
        tests: [not_null]
      - name: item_type
        tests:
          - accepted_values:
              values: ['addition', 'deduction']

  - name: fct_processed_salary
    description: >
      Processed payroll snapshot fact. Grain: employee_sk × payroll_period_sk × payroll_group_sk.
    columns:
      - name: processed_salary_sk
        tests: [unique, not_null]
      - name: tenant_id
        tests: [not_null]
      - name: source_processed_salary_id
        tests: [not_null]
      - name: payroll_group_sk
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - employee_sk
            - payroll_period_sk
            - payroll_group_sk
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_processed_salary_id

  - name: int_processed_add_ded_enriched
    description: Staging enrichments for processed add/ded lines.
    columns:
      - name: source_add_ded_id
        tests: [not_null]

  - name: int_variable_pay_items
    description: Staging enrichments for variable pay lines.
    columns:
      - name: source_variable_id
        tests: [not_null]

  - name: fct_processed_add_ded
    description: Vertical additions/deductions fact from processed_sal_add_ded.
    columns:
      - name: processed_add_ded_sk
        tests: [unique, not_null]
      - name: amount
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                where: "amount is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_add_ded_id

  - name: fct_variable_pay_item
    description: Dynamic variable additions/deductions fact.
    columns:
      - name: variable_pay_item_sk
        tests: [unique, not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_variable_id
            - variable_item_type

  - name: stg_processed_tax_data
    description: Staged processed tax lines from processed_tax_data_for_employee.
    columns:
      - name: source_tax_id
        tests: [unique, not_null]

  - name: stg_processed_loan_deduction
    description: Staged loan and installment deductions.
    columns:
      - name: source_loan_deduction_id
        tests: [unique, not_null]

  - name: fct_processed_tax
    description: Processed tax breakdown per employee × period × tax component.
    columns:
      - name: processed_tax_sk
        tests: [unique, not_null]

  - name: fct_processed_loan_deduction
    description: Loan and installment deductions from processed_loan_data / installments.
    columns:
      - name: processed_loan_sk
        tests: [unique, not_null]

  - name: fct_compliance_payroll
    description: EPF/ETF compliance amounts from processed salary statutory columns.
    columns:
      - name: compliance_payroll_sk
        tests: [unique, not_null]

  - name: fct_payroll_process_execution
    description: Payroll run execution metadata (from stg_payroll_runs / processed snapshots).
    columns:
      - name: payroll_process_execution_sk
        tests: [unique, not_null]

  - name: fct_salary_bank_instruction
    description: Bank payment instructions by employee × payroll period.
    columns:
      - name: salary_bank_instruction_sk
        tests: [unique, not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - source_system
            - source_salary_bank_data_id
            - payroll_period_sk

  - name: mart_processed_payroll_summary
    description: Primary payroll BI mart per employee × period (§8.1).
    columns:
      - name: employee_sk
        tests: [not_null]
      - name: payroll_period_sk
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tenant_id
            - employee_sk
            - payroll_period_sk

  - name: fct_processed_attendance_payroll
    columns:
      - name: attendance_payroll_sk
        tests: [unique, not_null]

  - name: fct_processed_multi_currency_salary
    columns:
      - name: processed_multi_currency_sk
        tests: [unique, not_null]
      - name: exchange_rate
        tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                where: "exchange_rate is not null"

  - name: fct_noncash_benefit
    columns:
      - name: noncash_benefit_sk
        tests: [unique, not_null]

  - name: mart_payroll_reconciliation
    columns:
      - name: payroll_group_sk
        tests: [not_null]
      - name: payroll_period_sk
        tests: [not_null]

  - name: mart_dynamic_pay_items
    columns:
      - name: total_amount
        tests: [not_null]

  - name: mart_statutory_summary
    columns:
      - name: payroll_period_sk
        tests: [not_null]

  - name: mart_cost_to_company
    columns:
      - name: employee_sk
        tests: [not_null]
      - name: payroll_period_sk
        tests: [not_null]

  - name: int_payroll_paysheet_vertical
    description: Unified fixed + variable pay lines with pivot_key for wide paysheet.

  - name: mart_horizontal_paysheet_core
    description: Paysheet core columns per employee × period.
    columns:
      - name: employee_sk
        tests: [not_null]
      - name: payroll_period_sk
        tests: [not_null]

  - name: mart_horizontal_paysheet_dynamic
    description: Wide paysheet with one column per distinct add/ded/variable item.
    columns:
      - name: employee_sk
        tests: [not_null]
      - name: payroll_period_sk
        tests: [not_null]

  - name: mart_payroll_pivot_column_catalog
    description: Discovered dynamic paysheet column catalog per tenant.
