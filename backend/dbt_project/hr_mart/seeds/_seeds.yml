version: 2

seeds:
  - name: payroll_report_column_config
    description: Metadata-driven pivot columns for mart_horizontal_paysheet_dynamic (§8.8).
    config:
      schema: "{{ var('mart_schema', target.name ~ '_hr') }}"
      tags: ['payroll', 'warehouse_payroll']
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: source_pay_item_name
        tests: [not_null]
      - name: output_column_name
        tests: [not_null]

  - name: dim_canonical_pay_item_seed
    description: >
      Tenant-scoped mapping from source payroll component labels to canonical
      names/categories. Extend via CSV or future API sync.
    config:
      schema: "{{ var('mart_schema', target.name ~ '_hr') }}"
      tags: ['payroll', 'warehouse_payroll']
    columns:
      - name: tenant_id
        tests: [not_null]
      - name: source_item_name
        tests: [not_null]
      - name: canonical_item_name
        tests: [not_null]
      - name: item_type
        tests:
          - accepted_values:
              values: ['addition', 'deduction']
