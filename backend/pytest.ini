# Pytest configuration for mint-analytics-v1.5 backend.
# Run from backend/ directory.
#
# Install test extras once (also pinned in requirements.txt):
#   pip install pytest pytest-asyncio pytest-sugar
#
# Datamart tests only (recommended — avoids other tests under tests/):
#   pytest tests/datamart
#
# Same via marker (pytest-sugar progress bar on the right; avoid -q):
#   pytest -m datamart
#
# Per-test names (still shows progress bar):
#   pytest -m datamart -v
#
# Non-interactive / piped output (CI, redirected logs):
#   pytest -m datamart --force-sugar
#
# Stop on first failure:
#   pytest -m datamart -x
#
# Slowest tests at the end:
#   pytest -m datamart --durations=10
#
# Disable sugar:
#   pytest -m datamart -p no:sugar
#
# Phase 10 live warehouse smoke (requires DATAMART_DB_* or tenant_registry):
#   set DATAMART_LIVE_TEST=1
#   pytest tests/datamart/test_live_smoke.py -m live -v
#   python tools/smoke_datamart_phase10.py
#   python tools/smoke_datamart_phase10.py --url http://127.0.0.1:8000 --chat
#
[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    datamart: Datamart agent, workspace, warehouse runtime, and DataHub scope tests.
    live: Phase 10 live warehouse / API smoke (set DATAMART_LIVE_TEST=1).
    unit: Unit tests with no live warehouse or LLM calls.

filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
