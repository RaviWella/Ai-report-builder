# HR datamart ER documentation — single source of truth.
# When marts change (add/rename/remove models or FKs), update this file and regenerate docs.
#
# Regenerate:  python backend/tools/generate_hr_er_pdf.py
# Validate only: python backend/tools/generate_hr_er_pdf.py --check

version: 1

domains:
  enterprise:
  leave:
  payroll:

# dbt model names (stem of .sql) included per domain (must match files on disk).
# Conformed dimensions (dim_employee, dim_date) may appear in multiple domains for ER joins.
domain_models:
  enterprise:
    - dim_date
    - dim_designation
    - dim_employee
    - dim_org_unit
    - dim_shift
    - fct_daily_attendance
    - fct_employment_snapshot
    - fct_lifecycle_event
    - fct_overtime
    - fct_salary_change
    - mart_attendance_monthly_summary
    - mart_employee_current
    - mart_headcount_monthly
    - mart_salary_band_summary
  leave:
    - dim_date
    - dim_employee
    - dim_leave_approval_level
    - dim_leave_reason
    - dim_leave_source
    - dim_leave_status
    - dim_leave_type
    - fact_leave_balance
    - fct_leave_application
    - fct_leave_approval
    - fct_leave_balance_snapshot
    - fct_leave_daily
    - fct_leave_planner
    - fct_lieu_leave_entitlement
    - fct_maternity_leave
    - fct_short_leave_usage
    - mart_department_leave_heatmap
    - mart_leave_employee_profile
    - mart_leave_monthly_summary
  payroll:
    - dim_bank
    - dim_bank_branch
    - dim_canonical_pay_item
    - dim_employee
    - dim_payroll_group
    - dim_payroll_period
    - fact_payroll
    - fct_compliance_payroll
    - fct_noncash_benefit
    - fct_payroll_process_execution
    - fct_processed_add_ded
    - fct_processed_attendance_payroll
    - fct_processed_loan_deduction
    - fct_processed_multi_currency_salary
    - fct_processed_salary
    - fct_processed_tax
    - fct_salary_bank_instruction
    - fct_variable_pay_item
    - mart_cost_to_company
    - mart_dynamic_pay_items
    - mart_horizontal_paysheet_core
    - mart_horizontal_paysheet_dynamic
    - mart_payroll_pivot_column_catalog
    - mart_payroll_reconciliation
    - mart_processed_payroll_summary
    - mart_statutory_summary

# Optional overrides (pk, grain, kind). Inferred from model name when omitted.
model_meta:
  dim_employee:
    grain: "SCD2 employee version (conformed); superior_emp_no = immediate manager emp_no"
    business_key: "source_emp_id, emp_no (+ valid_from for SCD2 version)"
  dim_bank:
    business_key: source_bank_id
  fct_processed_salary:
    business_key: source_processed_salary_id
  mart_employee_current:
    grain: "Current active employee OBT; resolves supervisor via superior_emp_no -> dim_employee.emp_no"
  dim_date:
    grain: Calendar
  dim_org_unit:
    grain: Organization hierarchy
  dim_designation:
    grain: Job title / grade
  dim_shift:
    grain: Work shift
  dim_payroll_period:
    grain: "Year x month x half"
  dim_payroll_group:
    grain: Payroll run group
  dim_bank:
    grain: Bank master
  dim_bank_branch:
    grain: Bank branch master
  dim_canonical_pay_item:
    grain: Normalized pay components
  fact_leave_balance:
    pk: id
    grain: Legacy approved-leave summary over fct_leave_application
  dim_leave_type:
    grain: SCD2 leave type (hr_leavetype)
  dim_leave_status:
    grain: Normalized workflow status lookup
  dim_leave_source:
    grain: Leave module origin lookup
  dim_leave_reason:
    grain: Predefined leave purpose lookup
  fct_leave_application:
    grain: One row per leave application (all implemented modules)
  fct_leave_daily:
    grain: Employee x leave date
  dim_leave_approval_level:
    grain: Approval hierarchy lookup
  fct_leave_balance_snapshot:
    grain: Employee x leave type x snapshot date
  fct_leave_approval:
    grain: One row per approval action
  fct_short_leave_usage:
    grain: One row per short leave request
  fct_lieu_leave_entitlement:
    grain: Earned lieu entitlement event
  fct_maternity_leave:
    grain: One row per maternity leave request
  fct_leave_planner:
    grain: One row per planned leave
  mart_leave_monthly_summary:
    grain: Month x department x leave type
  mart_leave_employee_profile:
    grain: Employee leave behavior profile
  mart_department_leave_heatmap:
    grain: Department x calendar date occupancy
  fact_payroll:
    kind: VIEW
    grain: "Legacy view of fct_processed_salary"
  mart_headcount_monthly:
    grain: Org x month headcount
  mart_attendance_monthly_summary:
    grain: Employee x month attendance
  mart_salary_band_summary:
    grain: Band x period summary
  mart_processed_payroll_summary:
    grain: Emp x period BI summary
  mart_horizontal_paysheet_core:
    grain: Wide paysheet core
  mart_horizontal_paysheet_dynamic:
    grain: Pivoted pay items
  mart_payroll_reconciliation:
    grain: Group x period reconcile
  mart_statutory_summary:
    grain: Statutory rollup
  mart_cost_to_company:
    grain: Cost to company (CTC)
  mart_dynamic_pay_items:
    grain: Dynamic pay items
  mart_payroll_pivot_column_catalog:
    grain: Tenant x pivot_key dynamic paysheet column catalog
  fct_processed_salary:
    grain: Emp x period x group
  fct_processed_add_ded:
    grain: Add/ded line
  fct_variable_pay_item:
    grain: Variable pay line
  fct_processed_tax:
    grain: Tax component
  fct_processed_loan_deduction:
    pk: processed_loan_sk
    grain: Loan deduction
  fct_compliance_payroll:
    grain: Statutory slice
  fct_payroll_process_execution:
    grain: Run metadata
  fct_processed_attendance_payroll:
    grain: Attendance in payroll
  fct_processed_multi_currency_salary:
    grain: FX salary
  fct_noncash_benefit:
    grain: Non-cash benefit
  fct_salary_bank_instruction:
    grain: Salary bank payment instruction by employee x period x account

relationships:
  enterprise:
    - { from: fct_daily_attendance, to: dim_employee, label: employee_sk }
    - { from: fct_overtime, to: dim_employee, label: employee_sk }
    - { from: fct_employment_snapshot, to: dim_employee, label: employee_sk }
    - { from: fct_employment_snapshot, to: dim_designation, label: designation_sk }
    - { from: fct_employment_snapshot, to: dim_org_unit, label: org_unit_sk }
    - { from: fct_lifecycle_event, to: dim_employee, label: employee_sk }
    - { from: fct_salary_change, to: dim_employee, label: employee_sk }
    - { from: mart_employee_current, to: dim_employee, label: employee_sk }
    - { from: mart_employee_current, to: dim_employee, label: superior_emp_no -> emp_no }
    - { from: mart_headcount_monthly, to: fct_employment_snapshot, label: aggregates }
    - { from: mart_headcount_monthly, to: dim_date, label: date_sk }
    - { from: mart_attendance_monthly_summary, to: fct_daily_attendance, label: aggregates }
    - { from: mart_attendance_monthly_summary, to: dim_employee, label: employee_sk }
