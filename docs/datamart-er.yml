    - { from: fact_leave_balance, to: fct_leave_application, label: legacy over }
    - { from: fct_leave_application, to: dim_employee, label: employee_sk }
    - { from: fct_leave_application, to: dim_leave_type, label: leave_type_sk }
    - { from: fct_leave_application, to: dim_leave_status, label: leave_status_sk }
    - { from: fct_leave_application, to: dim_leave_source, label: leave_source_sk }
    - { from: fct_leave_application, to: dim_leave_reason, label: leave_reason_sk }
    - { from: fct_leave_application, to: dim_date, label: start_date_sk }
    - { from: fct_leave_daily, to: fct_leave_application, label: leave_application_sk }
    - { from: fct_leave_daily, to: dim_employee, label: employee_sk }
    - { from: fct_leave_daily, to: dim_date, label: date_sk }
    - { from: fct_leave_balance_snapshot, to: dim_employee, label: employee_sk }
    - { from: fct_leave_balance_snapshot, to: dim_leave_type, label: leave_type_sk }
    - { from: fct_leave_balance_snapshot, to: dim_date, label: snapshot_date_sk }
    - { from: fct_leave_approval, to: fct_leave_application, label: leave_application_sk }
    - { from: fct_leave_approval, to: dim_employee, label: approver employee_sk }
    - { from: fct_leave_approval, to: dim_leave_approval_level, label: leave_approval_level_sk }
    - { from: fct_short_leave_usage, to: dim_employee, label: employee_sk }
    - { from: fct_short_leave_usage, to: dim_leave_type, label: leave_type_sk }
    - { from: fct_lieu_leave_entitlement, to: dim_employee, label: employee_sk }
    - { from: fct_maternity_leave, to: dim_employee, label: employee_sk }
    - { from: fct_maternity_leave, to: dim_leave_type, label: leave_type_sk }
    - { from: fct_leave_planner, to: dim_employee, label: employee_sk }
    - { from: fct_leave_planner, to: fct_leave_application, label: actual_leave_application_sk }
    - { from: mart_leave_monthly_summary, to: fct_leave_daily, label: aggregates }
    - { from: mart_leave_employee_profile, to: fct_leave_application, label: aggregates }
    - { from: mart_department_leave_heatmap, to: fct_leave_daily, label: aggregates }
  payroll:
    - { from: fct_processed_salary, to: dim_employee, label: employee_sk }
    - { from: fct_processed_salary, to: dim_payroll_period, label: payroll_period_sk }
    - { from: fct_processed_salary, to: dim_payroll_group, label: payroll_group_sk }
    - { from: fct_processed_add_ded, to: dim_employee, label: employee_sk }
    - { from: fct_processed_add_ded, to: dim_payroll_period, label: payroll_period_sk }
    - { from: fct_processed_add_ded, to: dim_payroll_group, label: payroll_group_sk }
    - { from: fct_processed_add_ded, to: dim_canonical_pay_item, label: canonical_pay_item_sk }
    - { from: fct_variable_pay_item, to: dim_employee, label: employee_sk }
    - { from: fct_variable_pay_item, to: dim_payroll_period, label: payroll_period_sk }
    - { from: fct_variable_pay_item, to: dim_canonical_pay_item, label: canonical_pay_item_sk }
    - { from: fct_processed_tax, to: dim_employee, label: employee_sk }
    - { from: fct_processed_tax, to: dim_payroll_period, label: payroll_period_sk }
    - { from: fct_processed_loan_deduction, to: dim_employee, label: employee_sk }
    - { from: fct_processed_loan_deduction, to: dim_payroll_period, label: payroll_period_sk }
    - { from: fct_compliance_payroll, to: dim_employee, label: employee_sk }
    - { from: fct_compliance_payroll, to: dim_payroll_period, label: payroll_period_sk }
    - { from: fct_salary_bank_instruction, to: dim_employee, label: employee_sk }
    - { from: fct_salary_bank_instruction, to: dim_payroll_period, label: payroll_period_sk }
    - { from: fct_salary_bank_instruction, to: dim_payroll_group, label: payroll_group_sk }
    - { from: fct_salary_bank_instruction, to: dim_bank, label: bank_sk }
    - { from: fct_salary_bank_instruction, to: dim_bank_branch, label: bank_branch_sk }
    - { from: fct_payroll_process_execution, to: dim_payroll_period, label: payroll_period_sk }
    - { from: fct_payroll_process_execution, to: dim_payroll_group, label: payroll_group_sk }
    - { from: mart_processed_payroll_summary, to: fct_processed_salary, label: rolls up }
    - { from: mart_horizontal_paysheet_core, to: fct_processed_salary, label: denormalizes }
    - { from: mart_horizontal_paysheet_dynamic, to: mart_horizontal_paysheet_core, label: extends }
    - { from: mart_horizontal_paysheet_dynamic, to: fct_processed_add_ded, label: pivot }
    - { from: mart_horizontal_paysheet_dynamic, to: fct_variable_pay_item, label: pivot }
    - { from: mart_horizontal_paysheet_dynamic, to: mart_payroll_pivot_column_catalog, label: column catalog }
    - { from: mart_payroll_reconciliation, to: fct_processed_salary, label: reconciles }
    - { from: mart_statutory_summary, to: fct_compliance_payroll, label: aggregates }
    - { from: mart_cost_to_company, to: fct_processed_salary, label: extends }
    - { from: mart_cost_to_company, to: fct_noncash_benefit, label: extends }
    - { from: mart_dynamic_pay_items, to: fct_variable_pay_item, label: aggregates }
    - { from: mart_dynamic_pay_items, to: fct_processed_add_ded, label: aggregates }
    - { from: fact_payroll, to: fct_processed_salary, label: view of }

semantic_views:
  - { name: vw_payroll_summary, reads: "mart_processed_payroll_summary, payroll facts" }
  - { name: vw_headcount, reads: "mart_headcount_monthly, dim_employee" }
  - { name: vw_employment_monthly, reads: fct_employment_snapshot }
  - { name: vw_attendance_summary, reads: mart_attendance_monthly_summary }
  - { name: vw_salary_bands, reads: mart_salary_band_summary }
  - { name: vw_lifecycle_summary, reads: fct_lifecycle_event }
  - { name: vw_turnover, reads: "lifecycle / employment facts" }
  - { name: vw_leave_summary, reads: "fact_leave_balance, fct_leave_application, dim_employee" }
  - { name: vw_current_leave_balance, reads: "fct_leave_balance_snapshot, dim_employee, dim_leave_type" }
  - { name: vw_employee_leave_history, reads: "fct_leave_application, dim_employee, dim_leave_type" }
  - { name: vw_pending_leave_approvals, reads: "fct_leave_approval, fct_leave_application, dim_employee" }
  - { name: vw_leave_liability, reads: "fct_leave_balance_snapshot, dim_employee, dim_leave_type" }
  - { name: vw_leave_utilization, reads: "mart_leave_monthly_summary, fct_leave_balance_snapshot" }
  - { name: vw_performance_summary, reads: performance staging }

# Governance metadata (not dbt models; provisioned by warehouse.py + ETL sync).
control_plane:
  schema: hr_control
  objects:
    - name: data_dictionary_object
      kind: TABLE
      pk: object_id
      grain: One row per warehouse table/view per tenant
    - name: data_dictionary_field
      kind: TABLE
      pk: field_id
      grain: One row per column per object
  relationships:
    - { from: data_dictionary_field, to: data_dictionary_object, label: object_id FK }
  semantic_exposure:
    - name: vw_data_dictionary
      schema: hr_semantic
      reads: "data_dictionary_object JOIN data_dictionary_field (flat field catalog)"

# dbt paths scanned by --check (relative to repo root)
dbt_discovery:
  employment_marts: backend/dbt_project/hr_mart/models/marts/employment
  payroll_marts: backend/dbt_project/hr_mart/models/marts/payroll
  leave_marts: backend/dbt_project/hr_mart/models/marts/leave
  legacy_marts: backend/dbt_project/hr_mart/models/marts
  semantic_views: backend/dbt_project/hr_mart/models/semantic

# Bronze staging feeds (hr_raw) — not ER entities; documented for lineage only.
bronze_lineage:
  dim_employee:
    - stg_employees
    - stg_company_hierarchy_individual
    - stg_departments
  dim_leave_type:
    - stg_leave_types
  dim_leave_reason:
    - stg_leave_reason
  fct_leave_application:
    - stg_leave_requests
  fct_leave_daily:
    - stg_leave_application_dates
    - stg_leave_requests
  fct_leave_balance_snapshot:
    - stg_leave_balance
    - stg_leave_entitlement
  fct_leave_approval:
    - stg_leave_approvals
    - stg_leave_requests
  fct_short_leave_usage:
    - stg_short_leave
  fct_lieu_leave_entitlement:
    - stg_lieu_leave_entitlement
  fct_maternity_leave:
    - stg_maternity_leave
  fct_leave_planner:
    - stg_leave_planner
  fact_leave_balance:
    - fct_leave_application
  fct_salary_bank_instruction:
    - stg_payroll_salary_retrieve
    - stg_payroll_salary_bank_data
    - stg_payroll_bank
    - stg_payroll_bank_branch

