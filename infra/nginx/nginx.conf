# Reverse proxy: TLS termination, routing, rate limiting (Architecture §4, §7.4).
# In production add ssl_certificate / ssl_certificate_key and listen 443 ssl.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # API -> FastAPI backend
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Matches the backend's gunicorn --timeout (Dockerfile) — the AI
        # rule-report chat can legitimately run well past 120s for a
        # broad/exploratory tool-calling request; nginx cutting the
        # connection here first would mask gunicorn's own timeout handling
        # with an even less informative dropped-connection error.
        proxy_read_timeout 300s;
    }

    # OpenAPI docs
    location /docs { proxy_pass http://api:8000/docs; }
    location /openapi.json { proxy_pass http://api:8000/openapi.json; }
    location /health { proxy_pass http://api:8000/health; }

    # Static SPA assets are served by the frontend image in production.
    location / { return 404; }
}
