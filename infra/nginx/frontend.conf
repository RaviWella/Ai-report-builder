# Serves the built SPA and proxies /api to the backend (production frontend image).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Matches the backend's gunicorn --timeout (backend/Dockerfile) — the
        # AI rule-report chat can legitimately run well past nginx's 60s
        # default for a broad/exploratory tool-calling request.
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
